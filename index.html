<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDGER OF THE LOST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0b0e14;
    --panel:#171b26;
    --panel-2:#1f2433;
    --brass:#c9a15a;
    --brass-dim:#8a713c;
    --terminal:#7fbf8f;
    --blood:#b4453a;
    --paper:#e8e1d0;
    --marigold:#e8823a;
    --mako:#6fe0a0;
  }
  *{box-sizing:border-box;}
  p,div,span{overflow-wrap:break-word;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--void);
    color:var(--paper);
    font-family:'IBM Plex Mono',monospace;
    overflow-y:auto;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #wrap{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100%;
    padding:16px;
    box-sizing:border-box;
  }
  #frame{
    position:relative;
    border:3px solid var(--brass-dim);
    outline:1px solid rgba(0,0,0,0.8);
    outline-offset:4px;
    box-shadow:
      0 0 0 1px #000,
      0 0 60px rgba(201,161,90,0.12),
      0 24px 60px rgba(0,0,0,0.7),
      inset 0 0 60px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.06);
    background:#000;
    width:800px;max-width:96vw;
  }
  #title-bar{
    display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;
    row-gap:4px;
    padding:6px 14px;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border-bottom:2px solid var(--brass-dim);
    box-shadow:0 1px 0 rgba(0,0,0,0.6), inset 0 -6px 10px -8px rgba(0,0,0,0.7);
    font-family:'Playfair Display',serif;
    position:relative;
  }
  #title-bar::before, #title-bar::after{
    content:'';position:absolute;top:50%;width:5px;height:5px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #e6c98a, var(--brass-dim) 70%);
    transform:translateY(-50%);box-shadow:inset 0 0 1px #000;
  }
  #title-bar::before{left:5px;} #title-bar::after{right:5px;}
  #title-bar .name{
    font-weight:700;color:var(--brass);font-size:clamp(11.5px,3.6vw,15px);
    letter-spacing:clamp(0.5px,0.5vw,2px);white-space:nowrap;
    text-shadow:0 1px 0 rgba(0,0,0,0.6), 0 0 10px rgba(201,161,90,0.25);
  }
  #title-bar .name .compass-icon{display:inline-block;animation:compasssway 5s ease-in-out infinite;transform-origin:50% 55%;}
  @keyframes compasssway{
    0%,100%{transform:rotate(-8deg);}
    50%{transform:rotate(8deg);}
  }
  #title-bar .file{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8a8f9c;
    flex-wrap:wrap;row-gap:4px;justify-content:flex-end;
  }
  #buildStamp{cursor:pointer;opacity:0.7;font-size:10px;white-space:nowrap;}
  #file-tag{white-space:nowrap;}
  #title-bar .chevron-trim{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);height:6px;margin:0;opacity:0.5;}
  @media (max-width: 480px){
    #title-bar .file{gap:7px !important;font-size:10px;}
    #muteBtn, #questBtn, #settingsBtn, #bestiaryBtn, #invBtn, #skillsBtn{font-size:12px;}
    #buildStamp{display:none;}
  }
  #buildStamp:hover{opacity:1;color:var(--brass);}
  #muteBtn, #questBtn, #settingsBtn, #bestiaryBtn, #invBtn, #skillsBtn{cursor:pointer;font-size:13px;opacity:0.85;position:relative;}
  #muteBtn:hover, #questBtn:hover, #settingsBtn:hover, #bestiaryBtn:hover, #invBtn:hover, #skillsBtn:hover{opacity:1;}
  #skillsBtn.pip::after{
    content:'';position:absolute;top:-3px;right:-4px;width:7px;height:7px;border-radius:50%;
    background:var(--terminal);box-shadow:0 0 5px rgba(127,191,143,0.9);
  }
  #panel .skillrow{
    display:flex;align-items:center;justify-content:space-between;width:min(340px,90vw);
    padding:8px 10px;margin-bottom:8px;border:1px solid var(--brass-dim);background:rgba(255,255,255,0.02);
    box-sizing:border-box;
  }
  #panel .skillrow > div:first-child{flex:1 1 auto;min-width:0;}
  #panel .skillrow .sname{font-size:12px;color:var(--paper);text-align:left;overflow-wrap:break-word;}
  #panel .skillrow .sdesc{font-size:10px;color:#9a9fac;text-align:left;margin-top:2px;max-width:100%;overflow-wrap:break-word;}
  #panel .skillrow .spts{font-size:11px;color:var(--terminal);margin:0 10px;white-space:nowrap;}
  #panel .skillplus{
    border:1px solid var(--brass);width:24px;height:24px;line-height:22px;text-align:center;
    cursor:pointer;color:var(--brass);font-size:14px;flex-shrink:0;
  }
  #panel .skillplus:hover{background:var(--brass);color:#000;}
  #panel .skillplus.disabled{opacity:0.25;pointer-events:none;}
  #panel .itemgrid{display:flex;flex-wrap:wrap;gap:10px;width:min(340px,90vw);margin-bottom:16px;justify-content:center;}
  #panel .itemcard{
    width:96px;border:1px solid var(--brass-dim);padding:10px 6px 8px;cursor:pointer;
    background:radial-gradient(ellipse at top, rgba(111,224,160,0.05), rgba(255,255,255,0.02) 60%);
    text-align:center;font-size:10px;color:#c9c3b0;
    border-radius:6px;
    transition:border-color .15s, box-shadow .15s, transform .1s;
  }
  #panel .itemcard .glyph{
    font-size:20px;color:var(--brass);margin-bottom:6px;
    display:inline-flex;align-items:center;justify-content:center;
    width:34px;height:34px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #3a4258, #12141c 75%);
    box-shadow:inset 0 0 4px rgba(0,0,0,0.8), 0 0 0 1px rgba(201,161,90,0.25),
      0 0 10px rgba(201,161,90,0.15), 0 0 0 5px rgba(201,161,90,0.04);
    position:relative;
  }
  /* Glowing slot backing, like a materia socket housing */
  #panel .itemcard .glyph::before{
    content:'';position:absolute;inset:-6px;border-radius:50%;
    border:1px solid rgba(201,161,90,0.2);
    box-shadow:0 0 8px rgba(201,161,90,0.12) inset;
    pointer-events:none;
  }
  /* Orb sheen highlight, top-left */
  #panel .itemcard .glyph::after{
    content:'';position:absolute;top:15%;left:22%;width:32%;height:20%;
    background:rgba(255,255,255,0.35);border-radius:50%;
    filter:blur(1px);pointer-events:none;
  }
  #panel .itemcard.selected{
    border-color:var(--terminal);background:rgba(127,191,143,0.08);
    box-shadow:0 0 12px rgba(127,191,143,0.35);
  }
  #panel .itemcard.selected .glyph{
    background:radial-gradient(circle at 35% 30%, #c8f5d6, var(--mako) 55%, #2f7a4f 100%);
    box-shadow:0 0 10px rgba(111,224,160,0.85), inset 0 0 4px rgba(255,255,255,0.4),
      0 0 18px rgba(111,224,160,0.4), 0 0 0 5px rgba(111,224,160,0.08);
    color:#0b1f12;
  }
  #panel .itemcard.selected .glyph::before{
    border-color:rgba(111,224,160,0.4);
    box-shadow:0 0 12px rgba(111,224,160,0.25) inset;
    animation:makopulse 2s ease-in-out infinite;
  }
  #panel .itemcard:hover{border-color:var(--brass);transform:translateY(-2px);}
  #panel .itemdesc{width:min(320px,88vw);font-size:11px;color:#9a9fac;min-height:32px;margin-bottom:10px;}
  body.colorblind{
    --blood:#c76b1f;
    --terminal:#4fa8d8;
  }
  #panel{
    position:fixed;inset:0;width:100%;height:100dvh;height:100vh;
    background:
      radial-gradient(ellipse at center, rgba(14,11,18,0.97), rgba(3,2,4,0.99)),
      #08070a;
    backdrop-filter:blur(2px);
    display:none;flex-direction:column;align-items:center;
    justify-content:center;justify-content:safe center;
    text-align:center;padding:28px 20px;pointer-events:auto;z-index:50;
    overflow-y:auto;-webkit-overflow-scrolling:touch;box-sizing:border-box;
  }
  #panel::before{
    content:'';position:absolute;inset:14px;pointer-events:none;
    border:1px solid rgba(201,161,90,0.14);
  }
  #panel h1{
    font-family:'Playfair Display',serif;font-weight:900;color:var(--brass);
    letter-spacing:2px;margin:0 0 6px 0;
    text-shadow:0 1px 0 rgba(255,255,255,0.18), 0 -1px 0 rgba(0,0,0,0.65), 0 0 20px rgba(201,161,90,0.35);
  }
  #panel h1::after{
    content:'◆ ◆ ◆';
    display:block;color:var(--brass-dim);font-size:8px;letter-spacing:7px;
    margin-top:7px;opacity:0.7;
  }
  #panel .sub{color:var(--terminal);font-size:11px;letter-spacing:2.5px;margin-bottom:18px;}
  #panel .questlist{text-align:left;width:min(320px,88vw);font-size:12px;color:#c9c3b0;margin-bottom:18px;}
  #panel .questitem{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid rgba(201,161,90,0.12);}
  #panel .questitem.done{color:#7fbf8f;}
  #panel .settingsrow{display:flex;align-items:center;justify-content:space-between;width:min(280px,88vw);margin-bottom:14px;font-size:12px;}

  /* --- Insult Duel: Monkey-Island-style "insult sword fighting" --- */
  #panel.duel-mode{
    background:
      radial-gradient(ellipse at center, rgba(20,14,10,0.97), rgba(4,3,2,0.99)),
      #08070a;
  }
  .duel-h1{position:relative;}
  .duel-h1::before{
    content:'⚔';display:block;font-size:22px;color:var(--marigold);
    text-shadow:0 0 12px rgba(232,130,58,0.6);margin-bottom:6px;
    opacity:0.9;
  }
  .duel-insult{
    position:relative;
    max-width:min(340px,88vw);
    color:#f0c9a8;
    font-style:italic;
    font-size:14px;line-height:1.6;
    background:rgba(30,18,10,0.55);
    border:1px solid rgba(232,130,58,0.35);
    border-radius:16px;
    padding:14px 18px 18px;
    margin:6px auto 22px;
  }
  .duel-insult::after{
    content:'';position:absolute;left:38px;bottom:-10px;
    border-width:10px 8px 0 0;border-style:solid;
    border-color:rgba(232,130,58,0.35) transparent transparent transparent;
  }
  .duel-opt{
    border-color:var(--brass-dim);
    position:relative;padding-left:26px !important;
  }
  .duel-opt::before{
    content:'⚔';position:absolute;left:8px;top:50%;transform:translateY(-50%) rotate(-90deg);
    font-size:11px;color:var(--marigold);opacity:0;transition:opacity .15s;
  }
  .duel-opt:hover::before{opacity:1;}
  .btn.duel-opt:hover{border-color:var(--marigold);color:#000;background:var(--marigold);}
  #panel input[type=range]{width:140px;accent-color:var(--brass);}
  #panel .toggle{border:1px solid var(--brass-dim);padding:5px 12px;cursor:pointer;font-size:11px;color:var(--terminal);}
  #panel .toggle.on{background:var(--brass-dim);color:#000;}
  #stage{position:relative;width:800px;max-width:96vw;aspect-ratio:800/600;background:#000;overflow:hidden;}
  #stage::after{
    content:'';
    position:absolute; inset:0;
    pointer-events:none;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.05) 3px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(0,0,0,0.22) 100%);
  }
  #stage::before{
    content:'';
    position:absolute; inset:-20px;
    pointer-events:none;
    z-index:3;
    background-image:
      radial-gradient(circle, rgba(232,130,58,0.55) 1px, transparent 1.6px),
      radial-gradient(circle, rgba(232,130,58,0.35) 1.2px, transparent 1.8px),
      radial-gradient(circle, rgba(111,224,160,0.3) 1px, transparent 1.6px);
    background-size:180px 220px, 260px 300px, 340px 260px;
    background-position:10px 0, 90px 60px, 200px 20px;
    opacity:0.4;
    animation:embersrise 22s linear infinite;
  }
  @keyframes embersrise{
    0%{background-position:10px 0, 90px 60px, 200px 20px;}
    100%{background-position:10px -220px, 90px -300px, 200px -260px;}
  }
  #frame::before{
    content:'';
    position:absolute; inset:0;
    pointer-events:none;
    background-image:
      radial-gradient(circle at 9px 9px, rgba(201,161,90,0.45) 1.4px, transparent 1.6px),
      radial-gradient(circle at calc(100% - 9px) 9px, rgba(201,161,90,0.45) 1.4px, transparent 1.6px),
      radial-gradient(circle at 9px calc(100% - 9px), rgba(201,161,90,0.45) 1.4px, transparent 1.6px),
      radial-gradient(circle at calc(100% - 9px) calc(100% - 9px), rgba(201,161,90,0.45) 1.4px, transparent 1.6px);
  }
  #frame::after{
    content:'';
    position:absolute; inset:0;
    pointer-events:none;
    opacity:0.05;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  canvas{
    position:absolute;top:0;left:0;width:100%;height:100%;
    image-rendering:pixelated;image-rendering:crisp-edges;
    display:none;
  }
  #game3d{image-rendering:auto;}
  #postfx{
    position:absolute;top:0;left:0;width:100%;height:100%;
    pointer-events:none;z-index:2;
  }
  #postfx::before{
    content:'';position:absolute;inset:0;
    mix-blend-mode:soft-light;opacity:0.5;
    background:
      linear-gradient(135deg, rgba(255,150,70,0.16) 0%, rgba(255,150,70,0) 30%),
      linear-gradient(-45deg, rgba(60,140,190,0.18) 0%, rgba(60,140,190,0) 35%),
      repeating-linear-gradient(100deg, rgba(0,0,0,0.32) 0px, rgba(0,0,0,0.32) 22px, rgba(0,0,0,0) 22px, rgba(0,0,0,0) 58px);
  }
  #postfx::after{
    content:'';position:absolute;top:-50%;left:-60%;width:60%;height:220%;
    background:linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,244,214,0.06) 45%, rgba(255,244,214,0.1) 50%, rgba(255,244,214,0.06) 55%, rgba(255,255,255,0) 100%);
    transform:rotate(12deg);
    animation:lightsweep 14s ease-in-out infinite;
    mix-blend-mode:screen;
  }
  @keyframes lightsweep{
    0%{left:-60%;}
    45%{left:120%;}
    100%{left:120%;}
  }
  #hud{
    position:absolute;top:0;left:0;width:100%;height:100%;
    pointer-events:none;
    font-family:'IBM Plex Mono',monospace;
  }
  .hud-top{
    position:absolute;top:10px;left:10px;right:10px;
    display:flex;justify-content:space-between;
    font-size:12px;color:var(--paper);
    text-shadow:0 1px 2px #000;
  }
  .hud-top > div:first-child{position:relative;padding:6px 10px 6px 8px;}
  .hud-top > div:first-child::before{
    content:'';position:absolute;top:-6px;left:-10px;width:200px;height:calc(100% + 12px);
    background:radial-gradient(ellipse at left center, rgba(111,224,160,0.16), rgba(111,224,160,0) 70%);
    pointer-events:none;z-index:-1;
    animation:makopulse 3.2s ease-in-out infinite;
  }
  @keyframes makopulse{
    0%,100%{opacity:0.6;}
    50%{opacity:1;}
  }
  .hpbar{
    width:160px;height:12px;border:1px solid var(--brass);
    background:#1a1006;position:relative;
    box-shadow:inset 0 2px 3px rgba(0,0,0,0.7), inset 0 -1px 0 rgba(255,255,255,0.06);
  }
  .hpfill{
    position:absolute;left:0;top:0;bottom:0;
    background:linear-gradient(180deg, #e2685a, var(--blood) 60%, #7a251d);
    box-shadow:0 0 5px rgba(180,69,58,0.6);
    transition:width .2s;
  }
  .limitbar{
    width:160px;height:6px;border:1px solid var(--brass-dim);
    background:#141018;position:relative;margin-top:4px;
    box-shadow:inset 0 1px 2px rgba(0,0,0,0.7);
  }
  .limitfill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#f0d27a,#e0c05a);transition:width .15s;}
  .limitfill.ready{
    background:linear-gradient(180deg,#fff3c4,#ffe07a);
    box-shadow:0 0 8px rgba(255,224,122,0.9), 0 0 2px rgba(255,255,255,0.8);
    animation:limitpulse 1.1s ease-in-out infinite;
  }
  .limitbar:has(.limitfill.ready){
    border-color:#ffe07a;
    box-shadow:0 0 14px rgba(255,224,122,0.85), 0 0 28px rgba(255,224,122,0.35), 0 0 2px rgba(255,255,255,0.7);
    animation:limitbarpulse 1.1s ease-in-out infinite;
  }
  @keyframes limitbarpulse{
    0%,100%{filter:brightness(1);transform:scaleY(1);}
    50%{filter:brightness(1.25);transform:scaleY(1.3);}
  }
  @keyframes limitpulse{
    0%,100%{filter:brightness(1);}
    50%{filter:brightness(1.35);}
  }
  .atb-ready{
    display:inline-block;color:#0b1f12;background:linear-gradient(180deg,#c8f5d6,var(--mako) 70%);
    padding:1px 6px;border-radius:8px;font-weight:700;letter-spacing:0.5px;
    box-shadow:0 0 8px rgba(111,224,160,0.75), 0 0 2px rgba(255,255,255,0.6);
    animation:limitpulse 1.1s ease-in-out infinite;
  }
  .deco-trim{
    height:5px;width:min(400px,80vw);margin:0 auto 20px;
    background-image:
      linear-gradient(135deg, var(--brass-dim) 25%, transparent 25%),
      linear-gradient(225deg, var(--brass-dim) 25%, transparent 25%),
      linear-gradient(315deg, var(--brass-dim) 25%, transparent 25%),
      linear-gradient(45deg, var(--brass-dim) 25%, transparent 25%);
    background-size:12px 12px;
    background-position:0 0, 0 0, 6px 6px, 6px 6px;
    opacity:0.55;
  }
  /* Art Deco chevron trim, Grim Fandango-flavored: a banded zigzag strip
     that sits under the main title, brass-on-marigold, with a thin double
     rule above/below like a Manny Calavera title card. */
  .chevron-trim{
    position:relative;
    height:14px;width:min(300px,72vw);margin:2px auto 22px;
    background-image:
      linear-gradient(45deg, var(--marigold) 25%, transparent 25%),
      linear-gradient(-45deg, var(--marigold) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--marigold) 75%),
      linear-gradient(-45deg, transparent 75%, var(--marigold) 75%);
    background-size:16px 16px;
    background-position:0 0, 0 0, 8px 8px, 8px 8px;
    opacity:0.6;
    -webkit-mask-image:linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
    mask-image:linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
  }
  .chevron-trim::before, .chevron-trim::after{
    content:'';position:absolute;left:0;right:0;height:1px;
    background:linear-gradient(90deg, transparent, var(--brass-dim), transparent);
  }
  .chevron-trim::before{top:-4px;} .chevron-trim::after{bottom:-4px;}
  /* Sugar-skull glyph, drawn in CSS rather than emoji so it can carry the
     marigold Dia de los Muertos accent consistently with the rest of the
     Grim-Fandango-flavored chrome. Sits ahead of the case-file tag. */
  .skull-glyph{
    display:inline-block;width:11px;height:11px;margin-right:4px;position:relative;
    vertical-align:-1px;
  }
  .skull-glyph::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 50% 42%, var(--paper) 0 38%, transparent 39%),
      radial-gradient(circle at 32% 42%, var(--marigold) 0 12%, transparent 13%),
      radial-gradient(circle at 68% 42%, var(--marigold) 0 12%, transparent 13%);
    filter:drop-shadow(0 0 2px rgba(232,130,58,0.5));
    border-radius:50% 50% 42% 42%;
    opacity:0.9;
  }
  .skull-glyph::after{
    content:'';position:absolute;left:35%;top:66%;width:30%;height:18%;
    background:var(--void);opacity:0.75;
    clip-path:polygon(0 0,100% 0,80% 100%,20% 100%);
  }
  /* Second ember layer, offset speed/scale from #stage::before, so the
     marigold drift reads with real depth (near/far embers) rather than a
     single flat particle field, and extends across the full frame
     including the title bar and touch controls, not just the canvas. */
  #frame::before{ z-index:4; }
  #wrap{
    position:relative;
  }
  #wrap::after{
    content:'';position:absolute; inset:0; pointer-events:none; z-index:5;
    background-image:
      radial-gradient(circle, rgba(232,130,58,0.45) 1px, transparent 1.6px),
      radial-gradient(circle, rgba(232,130,58,0.28) 0.8px, transparent 1.4px);
    background-size:260px 340px, 190px 260px;
    background-position:40px 10px, 150px 120px;
    opacity:0.35;
    animation:embersriseSlow 34s linear infinite;
  }
  @keyframes embersriseSlow{
    0%{background-position:40px 10px, 150px 120px;}
    100%{background-position:40px -340px, 150px -260px;}
  }
  .shardrow{display:flex;gap:7px;margin-top:5px;}
  .shardicon{
    width:17px;height:17px;border-radius:50%;
    border:1px solid var(--brass-dim);

  #overlay{

    display:grid;grid-template-columns:44px 44px 44px;grid-template-rows:44px 44px 44px;

  #dpad .tbtn{grid-column:2;}
  #dpad .tleft{grid-column:1;grid-row:2;}
  #dpad .tright{grid-column:3;grid-row:2;}
  #dpad .tup{grid-row:1;}
  #dpad .tdown{grid-row:3;}
  /* Notched-brass ship's-wheel look for the touch D-pad, Monkey-Island
     flavored: each spoke is a worn brass peg rather than a flat square. */
  .tbtn{
    border:1px solid var(--brass-dim);
    background:
      radial-gradient(circle at 35% 28%, #dcc494 0%, var(--panel-2) 38%, #10121a 82%);

      inset 0 0 0 5px rgba(0,0,0,0.55), inset 0 0 0 6px rgba(201,161,90,0.3);
    display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;touch-action:none;cursor:pointer;
    position:relative;
  }
  /* Wheel spokes radiating from the ACT hub, brass-capped like handles */
  #actbtn::before{
    content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;
    background-image:
      repeating-conic-gradient(from 0deg, rgba(201,161,90,0.5) 0deg 2deg, transparent 2deg 45deg);
    mix-blend-mode:screen;

    mask-image:radial-gradient(circle, transparent 34%, #000 35%, #000 92%, transparent 93%);
  }
  #actbtn::after{
    content:'';position:absolute;inset:8px;border-radius:50%;
    border:1px solid rgba(201,161,90,0.35);pointer-events:none;
  }
  #actbtn span{position:relative;z-index:1;}
  #actbtn:active{background:var(--brass-dim);color:#000;}
  #leaveBtn{
    position:absolute;top:10px;left:10px;
    display:none;pointer-events:auto;cursor:pointer;
    border:1px solid var(--blood);color:#ff9a8a;background:rgba(20,10,10,0.7);
    font-size:11px;padding:5px 10px;letter-spacing:1px;
    -webkit-tap-highlight-color:transparent;
  }
  #leaveBtn:hover{background:var(--blood);color:#fff;}
</style>

<script>
/* =========================================================================
   LEDGER OF THE LOST
   A noir-afterlife roguelite: pixel-art hub + turn-based dungeon crawling,
   a Matter.js physics puzzle vault, and a Three.js first-person "memory".
   Single-file, no external assets ... all art is drawn procedurally.
   ========================================================================= */

// ---------------------------------------------------------------------
// 0. GLOBAL STATE
// ---------------------------------------------------------------------
const TILE = 32;
let locationLabel = 'HUB ... RECORDS OFFICE';
const COLS = 25, ROWS = 18.75; // hub uses smaller grid; dungeon defines its own
const canvas2d = document.getElementById('game2d');
const ctx = canvas2d.getContext('2d');
const canvas3d = document.getElementById('game3d');

const el = {
  hudTop: document.getElementById('hud-top'),
  hudLevel: document.getElementById('hudLevel'),
  hpfill: document.getElementById('hpfill'),
  limitfill: document.getElementById('limitfill'),
  shardrow: document.getElementById('shardrow'),
  locationTag: document.getElementById('locationTag'),
  floorTag: document.getElementById('floorTag'),
  fileTag: document.getElementById('file-tag'),
  overlay: document.getElementById('overlay'),
  dialogue: document.getElementById('dialogue'),
  dlgSpeaker: document.getElementById('dlgSpeaker'),
  dlgBody: document.getElementById('dlgBody'),
  dlgChoices: document.getElementById('dlgChoices'),
  dlgHint: document.getElementById('dlgHint'),
  banner: document.getElementById('banner'),
  stamp: document.getElementById('stamp'),
  controlsNote: document.getElementById('controls-note'),
  leaveBtn: document.getElementById('leaveBtn'),
  buildStamp: document.getElementById('buildStamp'),
  muteBtn: document.getElementById('muteBtn'),
  questBtn: document.getElementById('questBtn'),
  invBtn: document.getElementById('invBtn'),
  bestiaryBtn: document.getElementById('bestiaryBtn'),
  skillsBtn: document.getElementById('skillsBtn'),
  settingsBtn: document.getElementById('settingsBtn'),
  panel: document.getElementById('panel'),
  seedTag: document.getElementById('seedTag'),
  abilityRow: document.getElementById('abilityrow'),
  turnOrderRow: document.getElementById('turnOrderRow'),
};

const SKILL_DEFS = {
  vigor:     { key:'vigor',     name:'Vigor Clause',      glyph:'♥', desc:'+4 Max HP per rank. The body remembers to keep functioning.' },
  precision: { key:'precision', name:'Precision Filing',  glyph:'✦', desc:'+3% Critical chance per rank. Every strike lands exactly where the form says it should.' },
  procedure: { key:'procedure', name:'Standard Procedure',glyph:'⚔', desc:'+1 flat damage per rank. Following the process, thoroughly.' },
  tenacity:  { key:'tenacity',  name:'Tenacity Rider',    glyph:'⛨', desc:'-1 damage taken per rank (minimum 1). You have survived worse paperwork than this.' },
};
const SHARD_DEFS = {
  ember:   { key:'ember',   name:'Ember Regret',    glyph:'E', desc:'A shard that burns cold. Adds weight to every blow you land.' },
  hollow:  { key:'hollow',  name:'Hollow Step',      glyph:'H', desc:'Grants the dash of one who has already left the room. [SPACE] to dash.' },
  wind:    { key:'wind',    name:'Second Wind',      glyph:'W', desc:'Refuses, once, to let you finish dying.' },
  weight:  { key:'weight',  name:"Ledger's Weight",  glyph:'L', desc:'Every blow against you is docked one point, on principle.' },
  tape:    { key:'tape',    name:'Red Tape',         glyph:'R', desc:'A third of your strikes bind the target in procedure ... they lose their next turn.' },
  photo:   { key:'photo',   name:'Faded Photograph', glyph:'P', desc:'Someone you were, once, before the paperwork.' },
};
const SHARD_KEYS = Object.keys(SHARD_DEFS);
function emptyShards(){ const o={}; SHARD_KEYS.forEach(k=>o[k]=false); return o; }

const TRINKET_DEFS = {
  cufflink: { key:'cufflink', name:'Brass Cufflink', desc:'+1 to every blow you land.', dmg:1 },
  ledger:   { key:'ledger',   name:'Worn Ledger',     desc:'+8 Max HP, carried like a shield.', hp:8 },
  stamp:    { key:'stamp',    name:'Lucky Stamp',     desc:'A little more of your hits land as critical notices.', crit:0.12 },
  compass:  { key:'compass',  name:'Case Compass',    desc:'You see a little further into the dark.', vision:1.5 },
  seal:     { key:'seal',     name:"Notary's Seal",   desc:'+15 Max HP and +1 to every blow. Bureaucracy, properly weaponized.', hp:15, dmg:1 },
};

// ---------------------------------------------------------------------
// 0a2. KEY ITEMS & COMBINATION ... a small point-and-click layer over the
// dungeon crawl. Raw pieces are found in Filing, combined in the
// inventory panel, and the finished item is presented to an NPC to
// unlock a one-off reward. Nothing here affects combat balance directly;
// it's a parallel puzzle thread, same spirit as the Vault and Archive.
// ---------------------------------------------------------------------
const ITEM_DEFS = {
  stamp_c:  { key:'stamp_c',  name:'Cracked Rubber Stamp', glyph:'☐', desc:"The department seal, snapped clean through. Useless like this ... but the crack looks clean, almost fixable." },
  ribbon:   { key:'ribbon',   name:'Dried Ink Ribbon',      glyph:'...', desc:"An old stamp-pad ribbon, brittle with age. Still holds a little color, if you press hard enough." },
  workingstamp: { key:'workingstamp', name:'Reassembled Stamp of Approval', glyph:'✓', desc:"Cracked stamp, re-inked and bound tight with wire. It works again. Someone downstairs might recognize proper authorization when they see it." },
};
const ITEM_COMBOS = [
  { pair:['stamp_c','ribbon'], result:'workingstamp',
    text:"You wire the cracked stamp back together and press the dry ribbon against it until it takes ink again. Against all odds ... it works." },
];
function findCombo(a,b){
  return ITEM_COMBOS.find(c=> (c.pair[0]===a&&c.pair[1]===b) || (c.pair[0]===b&&c.pair[1]===a) );
}

// ---------------------------------------------------------------------
// 0a3. INSULT DUEL ... a Monkey-Island-flavored war of complaints against
// the Clerk at Desk 14. Three rounds, one correct rebuttal each; win the
// majority for a one-time reward. Purely a dialogue minigame ... no
// bearing on the dungeon combat stats.
// ---------------------------------------------------------------------
const DUEL_LINES = [
  { insult:"You call THIS a completed W-9? My condolences to whoever raised you.",
    options:[
      {text:"Funny ... Section 4 says it's valid regardless of penmanship.", correct:true},
      {text:"At least mine doesn't have coffee rings on every page.", correct:false},
      {text:"I'll have you know my mother raised a professional.", correct:false},
    ]},
  { insult:"Filed a day late. In this department, that's practically a felony.",
    options:[
      {text:"Late is a business day concept. I've been dead since Tuesday.", correct:true},
      {text:"I was going to file early, but I got murdered.", correct:false},
      {text:"You'll have my form when you learn to read a postmark.", correct:false},
    ]},
  { insult:"Your handwriting belongs in a ransom note, not a case file.",
    options:[
      {text:"It's not a ransom note. Nobody's paying to get you back.", correct:true},
      {text:"You should see my cursive on a good day.", correct:false},
      {text:"I'll have you know I took penmanship in the afterlife.", correct:false},
    ]},
  { insult:"Three signatures short. Did you die before finishing the form, or because of it?",
    options:[
      {text:"Neither ... I died of the wait in this line.", correct:true},
      {text:"I signed plenty. You just can't read past line one.", correct:false},
      {text:"It's not my fault the pen ran out mid-afterlife.", correct:false},
    ]},
  { insult:"This ledger entry is illegible. A raccoon could file better.",
    options:[
      {text:"A raccoon's application is still pending review, actually.", correct:true},
      {text:"At least a raccoon shows up on time for its shift.", correct:false},
      {text:"That's slander. I've met the raccoon. He's worse.", correct:false},
    ]},
  { insult:"You expect a stamp of approval for THAT? Bold, for a corpse.",
    options:[
      {text:"Bold is filing at all when the alternative was staying dead quietly.", correct:true},
      {text:"I expect a stamp because I'm the one holding the stapler.", correct:false},
      {text:"You'll stamp it, or I'll haunt your desk specifically.", correct:false},
    ]},
  { insult:"You've been dead six months and still can't alphabetize. Embarrassing.",
    options:[
      {text:"Alphabetizing was never the job. Outliving you was.", correct:true},
      {text:"I skipped straight to the letters that matter.", correct:false},
      {text:"Six months and you're still counting? Get a hobby.", correct:false},
    ]},
  { insult:"Is that coffee stain older than your case file? Hard to say.",
    options:[
      {text:"Older than your patience, certainly ... and that's saying nothing.", correct:true},
      {text:"It's vintage. You wouldn't understand vintage.", correct:false},
      {text:"At least it's my stain and not somebody else's mess.", correct:false},
    ]},
  { insult:"You call that a signature? My condolences to cursive everywhere.",
    options:[
      {text:"Cursive died with everyone else here. It's in good company.", correct:true},
      {text:"It's not my fault the pen was possessed.", correct:false},
      {text:"I'll have you know that took real effort to make illegible.", correct:false},
    ]},
  { insult:"Three floors down and you still think this is a filing cabinet, not a dungeon.",
    options:[
      {text:"Down here, those turned out to be the same thing.", correct:true},
      {text:"I brought a sword just in case. Turns out I needed it.", correct:false},
      {text:"Call it what you want ... the paperwork's still due.", correct:false},
    ]},
  { insult:"Your case number is a joke. Even the ink is embarrassed.",
    options:[
      {text:"The ink's had worse company than me, believe it.", correct:true},
      {text:"Numbers don't have feelings. You'd know, working here.", correct:false},
      {text:"At least my number's odd. Suits the department.", correct:false},
    ]},
];
// A tougher second opponent, unlocked once Desk 14 has been beaten once.
// The "obviously funny" answer is usually the trap here ... the correct
// line plays it straighter, which is the point: this one's had practice.
const RIVAL_DUEL_LINES = [
  { insult:"Desk 14 goes easy on people. I don't. State your case, or don't waste my afternoon.",
    options:[

}

function formatTime(ms){

// 0b. SEEDED RNG ... dungeon layout can be made reproducible for a given
// seed string, which is the kind of thing a fellow developer will notice.
// ---------------------------------------------------------------------
let rng = Math.random;
let currentSeed = null;
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashSeed(str){
  let h = 1779033703 ^ str.length;
  for(let i=0;i<str.length;i++){
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return h >>> 0;
}
function setSeed(str){
  if(str && str.trim()){
    currentSeed = str.trim();
    rng = mulberry32(hashSeed(currentSeed));
  } else {
    currentSeed = null;
    rng = Math.random;
  }
  el.seedTag.textContent = currentSeed ? ('· seed: '+currentSeed) : '';
}

// 0c. SOUND ... tiny synth SFX via WebAudio, no asset files needed.
// ---------------------------------------------------------------------
let audioCtx = null;
let soundMuted = false;
let masterVolume = 0.8;
let ambientNodes = null;
let currentAmbientHz = 55;
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=null; }
  }
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  if(audioCtx && !ambientNodes) startAmbient();
}
function startAmbient(){
  if(!audioCtx || ambientNodes) return;
  try{
    const master = audioCtx.createGain();
    master.gain.value = 0;
    master.connect(audioCtx.destination);
    const osc1 = audioCtx.createOscillator(); osc1.type='sine'; osc1.frequency.value=currentAmbientHz;
    const osc2 = audioCtx.createOscillator(); osc2.type='sine'; osc2.frequency.value=currentAmbientHz*1.5;
    const g1 = audioCtx.createGain(); g1.gain.value=0.05;
    const g2 = audioCtx.createGain(); g2.gain.value=0.03;
    osc1.connect(g1).connect(master);
    osc2.connect(g2).connect(master);
    const lfo = audioCtx.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.045;
    const lfoGain = audioCtx.createGain(); lfoGain.gain.value=0.018;
    lfo.connect(lfoGain).connect(master.gain);
    osc1.start(); osc2.start(); lfo.start();
    ambientNodes = {master, osc1, osc2, lfo};
    updateAmbientVolume();
  }catch(e){ ambientNodes = null; }
}
function updateAmbientVolume(){
  if(!ambientNodes || !audioCtx) return;
  const target = (soundMuted ? 0 : masterVolume) * 0.4;
  ambientNodes.master.gain.setTargetAtTime(target, audioCtx.currentTime, 0.6);
}
// Ramps the ambient drone to a new base frequency over a couple of
// seconds ... called on entering the hub or the dungeon, and again on
// every floor transition, so each biome has a subtly different pitch
// without any jarring pitch-snap.
function updateAmbientPitch(hz){
  currentAmbientHz = hz;
  if(!ambientNodes || !audioCtx) return;
  const t = audioCtx.currentTime;
  ambientNodes.osc1.frequency.setTargetAtTime(hz, t, 1.4);
  ambientNodes.osc2.frequency.setTargetAtTime(hz*1.5, t, 1.4);
}
function beep(freq, dur, type, vol, delay){
  if(soundMuted || !audioCtx || masterVolume<=0) return;
  const t0 = audioCtx.currentTime + (delay||0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type||'square';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime((vol!=null?vol:0.12) * masterVolume, t0+0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
const SFX = {
  hit: ()=>beep(180,0.09,'square',0.10),
  crit: ()=>{ beep(120,0.12,'sawtooth',0.14); beep(90,0.14,'square',0.08,0.05); },
  hurt: ()=>beep(90,0.18,'sawtooth',0.14),
  pickup: ()=>{ beep(520,0.07,'sine',0.09); beep(780,0.08,'sine',0.08,0.06); },
  shard: ()=>{ beep(440,0.1,'sine',0.1); beep(660,0.12,'sine',0.1,0.08); beep(880,0.16,'sine',0.1,0.16); },
  dash: ()=>beep(300,0.08,'sawtooth',0.08),
  step: ()=>beep(220,0.02,'square',0.02),
  blip: ()=>beep(500,0.03,'square',0.04),
  levelup: ()=>{ [523,659,784,1047].forEach((f,i)=>beep(f,0.16,'triangle',0.11,i*0.08)); },
  puzzle: ()=>{ [392,494,587,784].forEach((f,i)=>beep(f,0.14,'sine',0.1,i*0.07)); },
  door: ()=>beep(150,0.12,'square',0.07),

  win: ()=>{ [523,659,784,1047,1319].forEach((f,i)=>beep(f,0.22,'triangle',0.12,i*0.1)); },
  achieve: ()=>{ beep(660,0.08,'sine',0.09); beep(990,0.1,'sine',0.09,0.09); },

  const needed = _duel.rival ? _duel.rounds.length : Math.ceil(_duel.rounds.length/2); // the Inspector requires a clean sweep
  const won = _duel.score >= needed;
  const h1=document.createElement('h1'); h1.style.fontSize='24px'; h1.textContent = won ? 'CASE DISMISSED' : 'OVERRULED';
  const sub=document.createElement('div'); sub.className='sub'; sub.textContent = _duel.score+' OF '+_duel.rounds.length+' LANDED';
  el.panel.appendChild(h1); el.panel.appendChild(sub);
  const p=document.createElement('p'); p.className='flavor';
  if(won){
    if(_duel.rival){
      p.textContent = "The Inspector goes quiet, then nods once ... the closest thing to respect this office issues.";

        state.rivalDuelWon = true;
        grantXp(20);

// 0d. JUICE ... screen shake, particle sparks, floating damage numbers.
// All purely cosmetic; game logic never depends on these.
// ---------------------------------------------------------------------
const fx = { shakeFrames:0, shakeMag:0, particles:[], floaters:[], flash:null };
function screenShake(mag, frames){ fx.shakeMag = Math.max(fx.shakeMag, mag); fx.shakeFrames = Math.max(fx.shakeFrames, frames); }
function screenFlash(color, alpha){ fx.flash = { color, alpha, t:1 }; }
function spawnParticles(x, y, color, count){
  for(let i=0;i<count;i++){
    const ang = Math.random()*Math.PI*2, spd = 1+Math.random()*2.5;
    fx.particles.push({ x,y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd, life:1, color, size:2+Math.random()*2 });
  }
}
function spawnFloater(x, y, text, color){
  fx.floaters.push({ x,y, text, color, life:1, vy:-0.6 });
}
function updateFx(){
  if(fx.shakeFrames>0){ fx.shakeFrames--; if(fx.shakeFrames<=0) fx.shakeMag=0; }
  fx.particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy;
    p.vx*=(p.friction!=null?p.friction:0.92);
    p.vy = p.vy*(p.friction!=null?p.friction:0.92) + (p.gravity||0);
    p.life-=(p.decay!=null?p.decay:0.045);
  });
  fx.particles = fx.particles.filter(p=>p.life>0 && p.y < canvas2d.height+20);
  fx.floaters.forEach(f=>{ f.y+=f.vy; f.life-=0.02; });
  fx.floaters = fx.floaters.filter(f=>f.life>0);
  if(fx.flash){ fx.flash.t -= 0.04; if(fx.flash.t<=0) fx.flash=null; }
}
function drawFx(){
  for(const p of fx.particles){
    ctx.globalAlpha = Math.max(0,p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  for(const f of fx.floaters){
    ctx.globalAlpha = Math.max(0,f.life);
    ctx.fillStyle = f.color;
    ctx.font = 'bold 13px "IBM Plex Mono"';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  if(fx.flash){
    ctx.globalAlpha = Math.max(0, fx.flash.t*fx.flash.alpha);
    ctx.fillStyle = fx.flash.color;
    ctx.fillRect(0,0,canvas2d.width,canvas2d.height);
    ctx.globalAlpha = 1;
  }
}
function beginShakeTransform(){
  if(fx.shakeMag>0){
    const dx = (Math.random()*2-1)*fx.shakeMag, dy = (Math.random()*2-1)*fx.shakeMag;
    ctx.save();
    ctx.translate(dx,dy);
    return true;
  }
  return false;
}
function endShakeTransform(shaking){ if(shaking) ctx.restore(); }

// Smooth per-object motion interpolation (visual only ... game logic stays grid-based)
function lerpVisual(obj, speed){
  if(obj.animX===undefined){ obj.animX=obj.x!==undefined?obj.x:obj.tileX; obj.animY=obj.y!==undefined?obj.y:obj.tileY; }
  const tx = obj.x!==undefined?obj.x:obj.tileX, ty = obj.y!==undefined?obj.y:obj.tileY;
  obj.animX += (tx-obj.animX)*(speed||0.35);
  obj.animY += (ty-obj.animY)*(speed||0.35);
}
// Small procedural "breathing" bob so idle characters don't read as frozen
// stickers ... a cheap stand-in for a real walk/idle animation frame set.
// Objects mid-stride (still tweening toward their tile) skip the bob so
// the walk motion itself reads clearly instead of fighting the bounce.
function idleBobPx(obj, phaseSeed){
  if(obj.animX!==undefined){
    const tx = obj.x!==undefined?obj.x:obj.tileX, ty = obj.y!==undefined?obj.y:obj.tileY;
    if(Math.abs(tx-obj.animX)+Math.abs(ty-obj.animY) > 0.03) return 0;
  }
  return Math.sin(performance.now()*0.0038 + (phaseSeed||0)) * 1.1;
}
// Two-beat "footfall" bounce while an object is mid-stride between tiles ...
// a cheap stand-in for a real walk-cycle frame set. Complements idleBobPx,
// which returns 0 while moving so the two never fight each other.
function walkBouncePx(obj){
  if(obj.animX===undefined) return 0;
  const tx = obj.x!==undefined?obj.x:obj.tileX, ty = obj.y!==undefined?obj.y:obj.tileY;
  const dist = Math.abs(tx-obj.animX)+Math.abs(ty-obj.animY);
  if(dist<=0.03) return 0;
  return -Math.abs(Math.sin(dist*Math.PI*2)) * 1.6;
}

    _konamiProgress++;

      _konamiProgress = 0;
      triggerKonami();
    }

});

// ---------------------------------------------------------------------
// Sprites are 8x8 character grids. '.' = transparent.
function drawSprite(ctx, sx, sy, grid, palette, scale){
  const s = scale || (TILE/8);
  // faint dark outline pass first, for readability against textured tiles
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  for(let r=0;r<grid.length;r++){
    const row = grid[r];
    for(let c=0;c<row.length;c++){
      if(row[c]==='.') continue;
      ctx.fillRect(sx+c*s-1, sy+r*s-1, s+2, s+2);
    }
  }
  for(let r=0;r<grid.length;r++){
    const row = grid[r];
    for(let c=0;c<row.length;c++){
      const ch = row[c];
      if(ch==='.') continue;
      ctx.fillStyle = palette[ch] || '#f0f';
      ctx.fillRect(sx + c*s, sy + r*s, s+0.5, s+0.5);
    }
  }
  // Rim-light / AO pass: a soft highlight along each filled region's
  // upper-left edge and a soft shadow along its lower-right, so flat
  // pixel fills read as lit, carved forms (PS1-era painterly shading)
  // instead of stickers. Cheap ... no new art assets, just edge detection
  // against the neighboring cells in the same 8x8 grid.
  const edge = Math.max(1, s*0.28);
  for(let r=0;r<grid.length;r++){
    const row = grid[r], rowAbove = grid[r-1], rowBelow = grid[r+1];
    for(let c=0;c<row.length;c++){
      if(row[c]==='.') continue;
      const topOpen = !rowAbove || rowAbove[c]==='.';
      const leftOpen = c===0 || row[c-1]==='.';
      if(topOpen || leftOpen){
        ctx.fillStyle = 'rgba(255,255,255,0.16)';
        if(topOpen) ctx.fillRect(sx+c*s, sy+r*s, s+0.5, edge);
        if(leftOpen) ctx.fillRect(sx+c*s, sy+r*s, edge, s+0.5);
      }
      const bottomOpen = !rowBelow || rowBelow[c]==='.';
      const rightOpen = c===row.length-1 || row[c+1]==='.';
      if(bottomOpen || rightOpen){
        ctx.fillStyle = 'rgba(0,0,0,0.24)';
        if(bottomOpen) ctx.fillRect(sx+c*s, sy+r*s+s-edge, s+0.5, edge);
        if(rightOpen) ctx.fillRect(sx+c*s+s-edge, sy+r*s, edge, s+0.5);
      }
    }
  }
}
function drawGroundShadow(ctx, cx, cy, w){
  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.beginPath();
  ctx.ellipse(cx, cy, w*0.42, w*0.15, 0, 0, Math.PI*2);
  ctx.fill();
}
function shadeColor(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  r = Math.max(0,Math.min(255,r+amt));
  g = Math.max(0,Math.min(255,g+amt));
  b = Math.max(0,Math.min(255,b+amt));
  return 'rgb('+r+','+g+','+b+')';
}
function hexToRgb(hex){
  const n = parseInt(hex.slice(1),16);
  return ((n>>16)&255)+','+((n>>8)&255)+','+(n&255);
}
function tileNoise(x,y,seed){
  const n = Math.sin(x*12.9898 + y*78.233 + (seed||0)*37.719) * 43758.5453;
  return n - Math.floor(n); // deterministic pseudo-random 0..1
}
function drawTorchlight(ctx, cx, cy, radius){
  const grad = ctx.createRadialGradient(cx,cy,0, cx,cy,radius);
  grad.addColorStop(0, 'rgba(255,196,120,0.14)');
  grad.addColorStop(0.55, 'rgba(255,176,100,0.06)');
  grad.addColorStop(1, 'rgba(255,176,100,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx,cy,radius,0,Math.PI*2);
  ctx.fill();
}
function drawVignette(ctx,w,h){
  // Filmic split-tone: a faint warm bloom low-left, a faint cool cast
  // high-right, then the usual dark vignette on top ... a cheap stand-in
  // for real color grading that gives the board more depth than a flat
  // radial darken alone.
  const warm = ctx.createRadialGradient(w*0.22,h*0.85,0, w*0.22,h*0.85,h*0.7);
  warm.addColorStop(0,'rgba(232,130,58,0.05)');
  warm.addColorStop(1,'rgba(232,130,58,0)');
  ctx.fillStyle = warm;
  ctx.fillRect(0,0,w,h);
  const cool = ctx.createRadialGradient(w*0.8,h*0.12,0, w*0.8,h*0.12,h*0.6);
  cool.addColorStop(0,'rgba(111,224,160,0.04)');
  cool.addColorStop(1,'rgba(111,224,160,0)');
  ctx.fillStyle = cool;
  ctx.fillRect(0,0,w,h);
  const grad = ctx.createRadialGradient(w/2,h/2,h*0.32, w/2,h/2,h*0.78);
  grad.addColorStop(0,'rgba(0,0,0,0)');
  grad.addColorStop(1,'rgba(0,0,0,0.5)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,w,h);
  // faint top-down grain band, like light falling through office blinds
  const t = performance.now()*0.00006;
  ctx.save();
  ctx.globalAlpha = 0.03;
  ctx.fillStyle = '#fff';
  for(let i=-2;i<8;i++){
    const x = ((i*140 + t*400) % (w+280)) - 140;
    ctx.beginPath();
    ctx.moveTo(x,0); ctx.lineTo(x+60,0); ctx.lineTo(x+10,h); ctx.lineTo(x-50,h);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function drawMarkerGlow(tileX, tileY, colorRgba){
  const glow = ctx.createRadialGradient(tileX+TILE/2,tileY+TILE/2,0, tileX+TILE/2,tileY+TILE/2,TILE*1.3);
  glow.addColorStop(0, colorRgba);
  glow.addColorStop(1, colorRgba.replace(/[\d.]+\)$/,'0)'));
  ctx.fillStyle = glow;
  ctx.fillRect(tileX-TILE*0.6, tileY-TILE*0.6, TILE*2.2, TILE*2.2);
}

const BIOMES = [
  { name:'FILING DEPARTMENT', wall:'#11141d', stairs:'#2a2f42', floor:'#1a1e2b', accent:'#c9a15a', torch:'255,190,110', ambientHz:55 },
  { name:'RECORDS HALL',      wall:'#1f1418', stairs:'#3a2226', floor:'#261a1e', accent:'#d47a5a', torch:'255,140,110', ambientHz:49 },

  { name:'THE DEEP ARCHIVE',  wall:'#1a1130', stairs:'#3a2a52', floor:'#241a3a', accent:'#e0c05a', torch:'190,150,255', ambientHz:44 },

];
function getBiome(floor){
  if(floor<=2) return BIOMES[0];

window.addEventListener('keydown', e=>{

// ---- Touch / on-screen controls (phones have no keyboard) ----
const TOUCH_DIR = {
  up:    { dx:0, dy:-1, keys:['w','arrowup'] },
  down:  { dx:0, dy:1,  keys:['s','arrowdown'] },
  left:  { dx:-1,dy:0,  keys:['a','arrowleft'] },
  right: { dx:1, dy:0,  keys:['d','arrowright'] },
};
const touchRepeatTimers = {};
function bindHold(elm, onDown, onUp){
  const start = (e)=>{ e.preventDefault(); onDown(); };
  const end = (e)=>{ e.preventDefault(); onUp && onUp(); };
  elm.addEventListener('touchstart', start, {passive:false});
  elm.addEventListener('touchend', end, {passive:false});
  elm.addEventListener('touchcancel', end, {passive:false});
  elm.addEventListener('mousedown', start);
  elm.addEventListener('mouseup', end);
  elm.addEventListener('mouseleave', end);
}
Object.keys(TOUCH_DIR).forEach(name=>{
  const d = TOUCH_DIR[name];
  const elm = document.getElementById('btn-'+name);
  if(!elm) return;
  bindHold(elm,
    ()=>{
      d.keys.forEach(k=>state.keys[k]=true);
      if(state.mode==='HUB' || state.mode==='DUNGEON' || state.mode==='ARCHIVE') tryMove(d.dx,d.dy);
      clearInterval(touchRepeatTimers[name]);
      touchRepeatTimers[name] = setInterval(()=>{
        if(state.mode==='HUB' || state.mode==='DUNGEON') tryMove(d.dx,d.dy);
      }, state.moveCd);
    },
    ()=>{
      d.keys.forEach(k=>state.keys[k]=false);
      clearInterval(touchRepeatTimers[name]);
    }
  );
});
const actBtn = document.getElementById('actbtn');
if(actBtn){
  bindHold(actBtn,
    ()=>{
      state.keys[' ']=true;
      if(state.mode==='DIALOGUE') advanceDialogue();
      else if(state.mode==='DUNGEON' && state.shards.hollow && state.player.dashCd<=0) dashMove();
      else if(state.mode==='ARCHIVE') archiveToggle();
      else if(state.mode==='DUNGEON' && state.shards.hollow && state.player.dashCd>0) { playSfx('blip'); flashBanner('Hollow Step is still cooling down.'); }
      else if(state.mode==='DUNGEON') { playSfx('blip'); flashBanner('Nothing to act on ... walk into an enemy to attack.'); }
      else if(state.mode==='HUB') { playSfx('blip'); flashBanner('Nothing to act on ... walk into someone or something to interact.'); }
      else if(state.mode==='PUZZLE') { playSfx('blip'); flashBanner('Push the crate with the D-pad. LEAVE if you want out.'); }
    },
    ()=>{ state.keys[' ']=false; }
  );
}
// Tapping the dialogue text itself also advances it (no keyboard needed).
document.getElementById('dialogue').addEventListener('click', (e)=>{
  if(e.target.classList.contains('choice')) return; // choices handle their own clicks
  if(state.mode==='DIALOGUE') advanceDialogue();
});

function handleKeyOnce(k, e){
  if(state.mode==='DIALOGUE'){
    if(k===' '||k==='enter'){ advanceDialogue(); e.preventDefault(); }
    return;
  }
  if(state.mode==='MENU' || state.mode==='GAMEOVER' || state.mode==='WIN' || state.mode==='PANEL') return;
  if(state.mode==='HUB' || state.mode==='DUNGEON' || state.mode==='ARCHIVE'){
    const dirs = {
      'w':[0,-1], 'arrowup':[0,-1],
      's':[0,1],  'arrowdown':[0,1],
      'a':[-1,0], 'arrowleft':[-1,0],
      'd':[1,0],  'arrowright':[1,0],
    };
    if(dirs[k]){
      tryMove(dirs[k][0], dirs[k][1]);
      e.preventDefault();
    }
    if(k===' ' && state.mode==='DUNGEON' && state.shards.hollow && state.player.dashCd<=0){
      dashMove();
      e.preventDefault();
    }
    if(k===' ' && state.mode==='ARCHIVE'){
      archiveToggle();
      e.preventDefault();
    }
    if(k==='1' && state.mode==='DUNGEON' && state.shards.ember){
      if(state.player.abilityCd.ember>0) flashBanner('Scorched Ledger is still cooling down.');
      else useEmberAbility();
      e.preventDefault();
    }
    if(k==='2' && state.mode==='DUNGEON' && state.shards.tape){
      if(state.player.abilityCd.tape>0) flashBanner('File Everything is still cooling down.');
      else useTapeAbility();
      e.preventDefault();
    }
  }
}

const HUB_ROWS = [
  "#########################",
  "#.......L...............#",
  "#..N1..............N3...#",
  "#.......................#",
  "#....######....######...#",
  "#....#....#....#....#...#",
  "#.......................#",
  "#..N2....................",
  "#.......................#",
  "#.........###...........#",
  "#.........#V#...........#",
  "#.......................#",
  "#####...............#####",
  "....#...............#....",
  "....#.......M.......#....",
  "....#################....",
];
// legend: # wall, . floor, N1/N2/N3 npc spots, V vault door (physics puzzle),
// L archive door (lever puzzle), M memory booth, the gap in row 7 right edge
// is the dungeon door ("..................." reaching edge)

const hub = { grid: [], w:0, h:0, npcs:{}, vault:null, archive:null, memory:null, dungeonDoor:null };
function buildHub(){
  hub.grid = HUB_ROWS.map(r=>r.split(''));
  hub.h = hub.grid.length; hub.w = hub.grid[0].length;
  // Auto-detect marker positions from the ASCII map instead of hardcoding
  // coordinates by hand (hand-counted offsets drift and silently break
  // interaction).
  const npcOrder = ['concierge','clerk','archivist']; // order of appearance, top-to-bottom
  const npcHits = [];
  for(let y=0;y<hub.h;y++){
    for(let x=0;x<hub.w;x++){
      const c = hub.grid[y][x];
      if(c==='N') npcHits.push({x,y});
      else if(c==='V') hub.vault = {x,y};
      else if(c==='L') hub.archive = {x,y};
      else if(c==='M') hub.memory = {x,y};
    }
  }
  npcHits.sort((a,b)=> a.y-b.y || a.x-b.x);
  npcHits.forEach((pos,i)=>{ if(npcOrder[i]) hub.npcs[npcOrder[i]] = pos; });
  hub.npcs.andy = {x:5, y:3}; // hidden ... only rendered/reachable once state.andyUnlocked is true
  hub.dungeonDoor = {x:24,y:7};
  // punch a door tile at the dungeon door / edge
  hub.grid[7][24] = 'D';
  // sub-basement hatch ... sealed until the Concierge is shown a working
  // Stamp of Approval (see ITEM_DEFS / talkToNpc('concierge'))
  hub.subbasement = {x:20, y:6};
  hub.grid[6][20] = 'B';
}
buildHub();

function hubTileAt(x,y){
  if(y<0||y>=hub.h||x<0||x>=hub.w) return '#';
  return hub.grid[y][x];
}
function hubSolid(x,y){
  const t = hubTileAt(x,y);
  return t==='#';
}
function npcAt(x,y){
  for(const key in hub.npcs){
    if(key==='andy' && !state.andyUnlocked) continue;
    const n = hub.npcs[key];
    if(n.x===x && n.y===y) return key;
  }
  return null;
}

function drawHub(){
  ctx.fillStyle = '#0b0e14';
  ctx.fillRect(0,0,canvas2d.width,canvas2d.height);
  const offX = (canvas2d.width - hub.w*TILE)/2;
  const offY = 40;
  const shaking = beginShakeTransform();
  const now = performance.now();

  function hubTileBase(x,y,ch){
    let b = tileColor(ch==='D'?'.':ch);
    const noise = tileNoise(x,y,0);
    return shadeColor(b, Math.round((noise-0.5)*8));
  }

  // PASS 1 ... flat base tiles
  for(let y=0;y<hub.h;y++){
    for(let x=0;x<hub.w;x++){
      const ch = hub.grid[y][x];
      const tileX = offX+x*TILE, tileY = offY+y*TILE;
      ctx.fillStyle = hubTileBase(x,y,ch);
      ctx.fillRect(tileX, tileY, TILE, TILE);
      if(ch!=='#'){
        ctx.strokeStyle = 'rgba(0,0,0,0.1)';
        ctx.lineWidth = 1;
        ctx.strokeRect(tileX+0.5, tileY+0.5, TILE-1, TILE-1);
      }
    }
  }

  // PASS 2 ... wall bevel + fake-height faces, and the door glow, drawn after
  // the floor pass so faces correctly overlay the tile below them
  for(let y=0;y<hub.h;y++){
    for(let x=0;x<hub.w;x++){
      const ch = hub.grid[y][x];
      const tileX = offX+x*TILE, tileY = offY+y*TILE;
      if(ch==='#'){
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.fillRect(tileX, tileY, TILE, 1.5);
        ctx.fillRect(tileX, tileY, 1.5, TILE);
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.fillRect(tileX, tileY+TILE-1.5, TILE, 1.5);
        ctx.fillRect(tileX+TILE-1.5, tileY, 1.5, TILE);
        ctx.strokeStyle = 'rgba(201,161,90,0.06)';
        ctx.strokeRect(tileX+0.5, tileY+0.5, TILE-1, TILE-1);

        const belowChar = hub.grid[y+1] ? hub.grid[y+1][x] : '#';
        if(belowChar !== '#'){
          const faceH = TILE*0.45;
          const wallBase = hubTileBase(x,y,ch);
          const faceGrad = ctx.createLinearGradient(0, tileY+TILE, 0, tileY+TILE+faceH);
          faceGrad.addColorStop(0, shadeColor(wallBase, -16));
          faceGrad.addColorStop(1, shadeColor(wallBase, -38));
          ctx.fillStyle = faceGrad;
          ctx.fillRect(tileX, tileY+TILE, TILE, faceH);
          ctx.fillStyle = 'rgba(0,0,0,0.35)';
          ctx.fillRect(tileX, tileY+TILE, TILE, 2);
          // occasional brass wall sconce, office-appropriate rather than open flame
          if(tileNoise(x,y,4.62) < 0.06){
            const flicker = 0.75+0.25*Math.sin(now*0.004 + x*2.3 + y*1.1);
            const fx = tileX+TILE/2, fy = tileY+TILE+faceH*0.4;
            const sg = ctx.createRadialGradient(fx,fy,0, fx,fy,TILE*1.3);
            sg.addColorStop(0, 'rgba(230,200,140,'+(0.22*flicker)+')');
            sg.addColorStop(1, 'rgba(230,200,140,0)');
            ctx.fillStyle = sg;
            ctx.fillRect(fx-TILE*1.3, fy-TILE*1.3, TILE*2.6, TILE*2.6);
            ctx.fillStyle = '#c9a15a';
            ctx.fillRect(fx-2, fy-1, 4, 3);
          }
        }
      }
      if(ch==='D'){
        const pulse = 0.5+0.5*Math.sin(now*0.003);
        const glow = ctx.createRadialGradient(tileX+TILE/2,tileY+TILE/2,0, tileX+TILE/2,tileY+TILE/2,TILE*1.4);
        glow.addColorStop(0, 'rgba(201,161,90,'+(0.25+0.13*pulse)+')');
        glow.addColorStop(1, 'rgba(201,161,90,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(tileX-TILE*0.7, tileY-TILE*0.7, TILE*2.4, TILE*2.4);
        ctx.fillStyle = '#c9a15a';
        ctx.fillRect(tileX+4, tileY+4, TILE-8, TILE-8);
        ctx.fillStyle = '#0b0e14';
        ctx.font = '10px monospace';
        ctx.fillText('>', tileX+11, tileY+21);
      }
    }
  }
  // vault marker
  const pulse2 = 0.5+0.5*Math.sin(performance.now()*0.0025);
  drawMarkerGlow(offX+hub.vault.x*TILE, offY+hub.vault.y*TILE, state.vaultSolved ? 'rgba(127,191,143,0.15)' : 'rgba(180,69,58,'+(0.18+0.1*pulse2)+')');
  ctx.fillStyle = state.vaultSolved ? '#3a4a3a' : '#4a2f2f';
  ctx.fillRect(offX+hub.vault.x*TILE, offY+hub.vault.y*TILE, TILE, TILE);
  ctx.fillStyle = '#c9a15a';
  ctx.font = '9px monospace';
  ctx.fillText(state.vaultSolved?'OPEN':'VAULT', offX+hub.vault.x*TILE-4, offY+hub.vault.y*TILE+20);

  // archive marker
  drawMarkerGlow(offX+hub.archive.x*TILE, offY+hub.archive.y*TILE, state.archiveSolved ? 'rgba(127,191,143,0.15)' : 'rgba(138,95,206,'+(0.16+0.1*pulse2)+')');
  ctx.fillStyle = state.archiveSolved ? '#3a4a3a' : '#2a2440';
  ctx.fillRect(offX+hub.archive.x*TILE, offY+hub.archive.y*TILE, TILE, TILE);
  ctx.fillStyle = '#c9a15a';
  ctx.font = '8px monospace';
  ctx.fillText(state.archiveSolved?'OPEN':'ARCHIVE', offX+hub.archive.x*TILE-8, offY+hub.archive.y*TILE+20);

  // memory booth
  if(state.shards.photo){
    drawMarkerGlow(offX+hub.memory.x*TILE, offY+hub.memory.y*TILE, 'rgba(138,143,206,'+(0.16+0.1*pulse2)+')');
  }
  ctx.fillStyle = state.shards.photo ? '#3a3a5a' : '#22243a';
  ctx.fillRect(offX+hub.memory.x*TILE, offY+hub.memory.y*TILE, TILE, TILE);
  ctx.fillStyle = '#8a8fce';
  ctx.font = '8px monospace';
  ctx.fillText('BOOTH', offX+hub.memory.x*TILE-6, offY+hub.memory.y*TILE+20);


  // sub-basement hatch
  const hatchOpen = state.subbasementUnlocked;
  drawMarkerGlow(offX+hub.subbasement.x*TILE, offY+hub.subbasement.y*TILE, hatchOpen ? 'rgba(201,161,90,'+(0.18+0.1*pulse2)+')' : 'rgba(120,120,120,0.08)');
  ctx.fillStyle = hatchOpen ? '#3a3020' : '#22242c';
  ctx.fillRect(offX+hub.subbasement.x*TILE, offY+hub.subbasement.y*TILE, TILE, TILE);
  ctx.fillStyle = hatchOpen ? '#c9a15a' : '#5f6472';
  ctx.font = '7px monospace';
  ctx.fillText(hatchOpen?'SUB-BSMT':'SEALED', offX+hub.subbasement.x*TILE-8, offY+hub.subbasement.y*TILE+20);

  // npcs
  drawGroundShadow(ctx, offX+hub.npcs.concierge.x*TILE+TILE/2, offY+hub.npcs.concierge.y*TILE+TILE*0.82, TILE);
  drawSprite(ctx, offX+hub.npcs.concierge.x*TILE, offY+hub.npcs.concierge.y*TILE+idleBobPx(hub.npcs.concierge,0), SPR_NPC1, PAL_NPC1);
  drawGroundShadow(ctx, offX+hub.npcs.clerk.x*TILE+TILE/2, offY+hub.npcs.clerk.y*TILE+TILE*0.82, TILE);
  drawSprite(ctx, offX+hub.npcs.clerk.x*TILE, offY+hub.npcs.clerk.y*TILE+idleBobPx(hub.npcs.clerk,1.4), SPR_NPC2, PAL_NPC2);
  drawGroundShadow(ctx, offX+hub.npcs.archivist.x*TILE+TILE/2, offY+hub.npcs.archivist.y*TILE+TILE*0.82, TILE);
  drawSprite(ctx, offX+hub.npcs.archivist.x*TILE, offY+hub.npcs.archivist.y*TILE+idleBobPx(hub.npcs.archivist,2.7), SPR_NPC3, PAL_NPC3);
  if(state.andyUnlocked && hub.npcs.andy){
    drawGroundShadow(ctx, offX+hub.npcs.andy.x*TILE+TILE/2, offY+hub.npcs.andy.y*TILE+TILE*0.82, TILE);
    drawSprite(ctx, offX+hub.npcs.andy.x*TILE, offY+hub.npcs.andy.y*TILE+idleBobPx(hub.npcs.andy,4.1), SPR_ANDY, PAL_ANDY);
    ctx.fillStyle='rgba(138,95,206,0.9)'; ctx.font='8px monospace';
    ctx.fillText('?', offX+hub.npcs.andy.x*TILE+13, offY+hub.npcs.andy.y*TILE-4);
  }

  // player (smoothed motion)
  lerpVisual(state.player, 0.45);
  const hpx = offX+state.player.animX*TILE, hpy = offY+state.player.animY*TILE;
  drawGroundShadow(ctx, hpx+TILE/2, hpy+TILE*0.82, TILE);
  drawSprite(ctx, hpx, hpy+idleBobPx(state.player,0.6)+walkBouncePx(state.player), SPR_PLAYER, PAL_PLAYER);

  updateFx();
  drawFx();
  endShakeTransform(shaking);
  drawVignette(ctx, canvas2d.width, canvas2d.height);

  ctx.fillStyle = 'rgba(201,161,90,0.85)';
  ctx.font = '11px "IBM Plex Mono"';
  ctx.fillText('RECORDS OFFICE ... walk into a clerk to talk, the door (>) leads to Filing.', offX, 24);
}
