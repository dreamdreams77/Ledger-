const dungeon = { grid:[], w:0, h:0, enemies:[], items:[], stairs:null, start:null, seen:[] };

function genDungeon(floorNum){
  const w = 27, h = 19;
  const grid = Array.from({length:h},()=>Array(w).fill('#'));
  const rooms = [];
  const roomCount = 6 + Math.floor(rng()*3);
  let attempts = 0;
  while(rooms.length < roomCount && attempts < 200){
    attempts++;
    const rw = 3 + Math.floor(rng()*4);
    const rh = 3 + Math.floor(rng()*3);
    const rx = 1 + Math.floor(rng()*(w-rw-2));
    const ry = 1 + Math.floor(rng()*(h-rh-2));
    const candidate = {x:rx,y:ry,w:rw,h:rh};
    let overlap = false;
    for(const r of rooms){
      if(candidate.x < r.x+r.w+1 && candidate.x+candidate.w+1 > r.x &&
         candidate.y < r.y+r.h+1 && candidate.y+candidate.h+1 > r.y){ overlap = true; break; }
    }
    if(overlap) continue;
    rooms.push(candidate);
    for(let y=ry;y<ry+rh;y++) for(let x=rx;x<rx+rw;x++) grid[y][x]='.';
  }
  // connect room centers in order with L-corridors
  for(let i=1;i<rooms.length;i++){
    const a = centerOf(rooms[i-1]), b = centerOf(rooms[i]);
    carveCorridor(grid, a, b);
  }
  function centerOf(r){ return {x: r.x+Math.floor(r.w/2), y: r.y+Math.floor(r.h/2)}; }
  function carveCorridor(grid, a, b){
    let x=a.x, y=a.y;
    const stepX = x<b.x?1:-1, stepY = y<b.y?1:-1;
    while(x!==b.x){ grid[y][x]='.'; x+=stepX; }
    while(y!==b.y){ grid[y][x]='.'; y+=stepY; }
    grid[b.y][b.x]='.';
  }

  dungeon.grid = grid; dungeon.w = w; dungeon.h = h;
  dungeon.enemies = [];
  dungeon.items = [];
  dungeon.seen = Array.from({length:h},()=>Array(w).fill(false));
  const startRoom = rooms[0];
  dungeon.start = centerOf(startRoom);
  const lastRoom = rooms[rooms.length-1];
  dungeon.stairs = centerOf(lastRoom);
  grid[dungeon.stairs.y][dungeon.stairs.x] = '>';

  // populate enemies (skip start room) ... variety scales in with floor depth
  const isBossFloor = floorNum === 3;
  const isMinibossFloor = floorNum === 5;
  const isFinalBossFloor = floorNum === 8;
  const enemyCount = (isBossFloor||isMinibossFloor||isFinalBossFloor) ? 3 : 3 + floorNum;
  for(let i=0;i<enemyCount;i++){
    const r = rooms[1+Math.floor(rng()*(rooms.length-1))];
    const ex = r.x+Math.floor(rng()*r.w);
    const ey = r.y+Math.floor(rng()*r.h);
    if(grid[ey][ex]!=='.' ) continue;
    if(ex===dungeon.start.x && ey===dungeon.start.y) continue;
    dungeon.enemies.push(makeEnemy(floorNum, ex, ey));
  }
  if(isBossFloor && !state.bossDefeated){
    dungeon.enemies.push({
      x: dungeon.stairs.x, y: Math.max(1,dungeon.stairs.y-1),
      hp: 40, maxHp:40, dmg:6, name:'The Auditor', spr:SPR_AUDITOR, pal:PAL_AUDITOR, alive:true, boss:true,
    });
  }
  if(isMinibossFloor && !state.minibossDefeated){
    dungeon.enemies.push({
      x: dungeon.stairs.x, y: Math.max(1,dungeon.stairs.y-1),
      hp: 55, maxHp:55, dmg:7, name:'The Repossessor', spr:SPR_MINIBOSS, pal:PAL_MINIBOSS, alive:true,
      miniboss:true, dropShard:'tape',
    });
  }
  if(isFinalBossFloor && !state.finalBossDefeated){
    dungeon.enemies.push({
      x: dungeon.stairs.x, y: Math.max(1,dungeon.stairs.y-1),
      hp: 90, maxHp:90, dmg:8, name:'The Chief Auditor', spr:SPR_FINALBOSS, pal:PAL_FINALBOSS, alive:true,
      finalboss:true, enraged:false,
    });
  }

  // items: potions + a guaranteed exploration shard on the first two floors
  for(let i=0;i<3;i++){
    const r = rooms[1+Math.floor(rng()*(rooms.length-1))];
    const ix = r.x+Math.floor(rng()*r.w);
    const iy = r.y+Math.floor(rng()*r.h);
    if(grid[iy][ix]!=='.') continue;
    dungeon.items.push({x:ix,y:iy,type:'potion'});
  }
  const shardForFloor = { 1:'ember', 2:'hollow' }[floorNum];
  if(shardForFloor && !state.shards[shardForFloor]){
    const r = rooms[Math.min(rooms.length-1, 2+Math.floor(rng()*2))];
    const ix = r.x+Math.floor(rng()*r.w);
    const iy = r.y+Math.floor(rng()*r.h);
    dungeon.items.push({x: (grid[iy]&&grid[iy][ix]==='.')?ix:dungeon.start.x, y:(grid[iy]&&grid[iy][ix]==='.')?iy:dungeon.start.y, type:'shard', shard:shardForFloor});
  }
  // key-item pieces for the stamp-of-approval puzzle (see ITEM_DEFS) ...
  // stop spawning once the reward's been claimed, or once the player is
  // already holding the piece / its combined form
  const itemForFloor = { 1:'stamp_c', 2:'ribbon' }[floorNum];
  if(itemForFloor && !state.subbasementClaimed &&
     !state.inventory.includes(itemForFloor) && !state.inventory.includes('workingstamp')){
    const r = rooms[Math.min(rooms.length-1, 1+Math.floor(rng()*(rooms.length-1)))];
    const ix = r.x+Math.floor(rng()*r.w);
    const iy = r.y+Math.floor(rng()*r.h);
    dungeon.items.push({x: (grid[iy]&&grid[iy][ix]==='.')?ix:dungeon.start.x, y:(grid[iy]&&grid[iy][ix]==='.')?iy:dungeon.start.y, type:'item', item:itemForFloor});
  }
  // occasional equippable trinket, independent of the shard track
  if(rng() < 0.55){
    const keys = Object.keys(TRINKET_DEFS);
    const pick = keys[Math.floor(rng()*keys.length)];
    const r = rooms[1+Math.floor(rng()*(rooms.length-1))];
    const ix = r.x+Math.floor(rng()*r.w);
    const iy = r.y+Math.floor(rng()*r.h);
    if(grid[iy] && grid[iy][ix]==='.'){
      dungeon.items.push({x:ix,y:iy,type:'trinket',trinket:pick});
    }
  }

  state.player.tileX = dungeon.start.x;
  state.player.tileY = dungeon.start.y;
  state.player.animX = dungeon.start.x;
  state.player.animY = dungeon.start.y;
  updateVisibility();
}

// Enemy factory ... introduces new types as floors get deeper.
function makeEnemy(floorNum, ex, ey){
  // A very rare, mostly-harmless joke enemy ... reuses the otherwise-unused
  // clerk sprite. About 1 in 40 spawns.
  if(rng() < 0.025){
    return { x:ex,y:ey, hp:3, maxHp:3, dmg:1,
      name:'The Intern (Unpaid)', spr:SPR_CLERK, pal:PAL_CLERK, alive:true, joke:true };
  }
  const roll = rng();
  if(floorNum>=7 && roll<0.10){
    return { x:ex,y:ey, hp:22+floorNum*2, maxHp:22+floorNum*2, dmg:3+Math.floor(floorNum/3),
      name:'Bound Archivist', spr:SPR_BOUNDARCH, pal:PAL_BOUNDARCH, alive:true, drains:true };
  }
  if(floorNum>=6 && roll<0.18){
    return { x:ex,y:ey, hp:10+floorNum*2, maxHp:10+floorNum*2, dmg:3+Math.floor(floorNum/3),
      name:'Notary Wraith', spr:SPR_WRAITH, pal:PAL_WRAITH, alive:true, weakens:true };
  }
  if(floorNum>=4 && roll<0.32){
    return { x:ex,y:ey, hp:5+floorNum, maxHp:5+floorNum, dmg:2+Math.floor(floorNum/2),
      name:'Ghost Auditor', spr:SPR_GHOST, pal:PAL_GHOST, alive:true, ranged:true };
  }
  if(floorNum>=2 && roll<0.6){
    return { x:ex,y:ey, hp:14+floorNum*3, maxHp:14+floorNum*3, dmg:2+Math.floor(floorNum/2),
      name:'Repo Man', spr:SPR_REPO, pal:PAL_REPO, alive:true, slow:true };
  }
  return { x:ex,y:ey, hp:6+floorNum*2, maxHp:6+floorNum*2, dmg:2+floorNum,
    name:'Filing Rat', spr:SPR_RAT, pal:PAL_RAT, alive:true, fast:true };
}

const VISION_RADIUS = 5.2;
function visionRadius(){ return VISION_RADIUS + trinketBonus('vision'); }
function updateVisibility(){
  const px = state.player.tileX, py = state.player.tileY;
  const r = visionRadius();
  for(let y=0;y<dungeon.h;y++){
    for(let x=0;x<dungeon.w;x++){
      if(dungeon.grid[y][x]==='#') continue;
      const d = Math.hypot(x-px, y-py);
      if(d<=r) dungeon.seen[y][x] = true;
    }
  }
}
function tileVisibleNow(x,y){
  return Math.hypot(x-state.player.tileX, y-state.player.tileY) <= visionRadius();
}

function dungeonSolid(x,y){
  if(y<0||y>=dungeon.h||x<0||x>=dungeon.w) return true;
  return dungeon.grid[y][x]==='#';
}
function enemyAt(x,y){ return dungeon.enemies.find(e=>e.alive && e.x===x && e.y===y); }

function dungeonMetrics(){
  const t = TILE*0.9;
  const offX = (canvas2d.width - dungeon.w*t)/2;
  const offY = 30;
  return {t, offX, offY};
}

function drawDungeon(){
  ctx.fillStyle = '#05060a';
  ctx.fillRect(0,0,canvas2d.width,canvas2d.height);
  const {t, offX, offY} = dungeonMetrics();
  const shaking = beginShakeTransform();
  const biome = getBiome(state.floor);
  const now = performance.now();

  function tileBase(x,y,c){
    let b;
    if(c==='#') b = biome.wall;
    else if(c==='>') b = biome.stairs;
    else b = biome.floor;
    const noise = tileNoise(x,y,state.floor);
    return shadeColor(b, Math.round((noise-0.5)*10));
  }

  // PASS 1 ... flat base tiles (floors + wall tops)
  for(let y=0;y<dungeon.h;y++){
    for(let x=0;x<dungeon.w;x++){
      if(!dungeon.seen[y][x]) continue; // unexplored tiles stay black
      const c = dungeon.grid[y][x];
      const visibleNow = tileVisibleNow(x,y);
      const base = tileBase(x,y,c);
      const tileX = offX+x*t, tileY = offY+y*t;
      ctx.fillStyle = visibleNow ? base : dimColor(base);
      ctx.fillRect(tileX, tileY, t, t);
      // faint grout lines on floor tiles for texture, so it doesn't read as one flat slab
      if(c!=='#' && visibleNow){
        ctx.strokeStyle = 'rgba(0,0,0,0.12)';
        ctx.lineWidth = 1;
        ctx.strokeRect(tileX+0.5, tileY+0.5, t-1, t-1);
      }
    }
  }

  // PASS 2 ... wall "faces" (fake height/depth), torches, and stairs glow, all
  // drawn after the floor pass so faces correctly overlay the tile below them
  for(let y=0;y<dungeon.h;y++){
    for(let x=0;x<dungeon.w;x++){
      if(!dungeon.seen[y][x]) continue;
      const c = dungeon.grid[y][x];
      const visibleNow = tileVisibleNow(x,y);
      const tileX = offX+x*t, tileY = offY+y*t;

      if(c==='#' && visibleNow){
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.fillRect(tileX, tileY, t, 1.5);
        ctx.fillRect(tileX, tileY, 1.5, t);
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(tileX, tileY+t-1.5, t, 1.5);
        ctx.fillRect(tileX+t-1.5, tileY, 1.5, t);

        const belowChar = dungeon.grid[y+1] ? dungeon.grid[y+1][x] : '#';
        if(belowChar !== '#'){
          // this wall faces the player ... give it visible height, like a raised block
          const faceH = t*0.5;
          const wallBase = tileBase(x,y,c);
          const faceGrad = ctx.createLinearGradient(0, tileY+t, 0, tileY+t+faceH);
          faceGrad.addColorStop(0, shadeColor(wallBase, -18));
          faceGrad.addColorStop(1, shadeColor(wallBase, -42));
          ctx.fillStyle = faceGrad;
          ctx.fillRect(tileX, tileY+t, t, faceH);
          ctx.fillStyle = 'rgba(0,0,0,0.4)';
          ctx.fillRect(tileX, tileY+t, t, 2);

          // sparse flickering wall torches, deterministically placed per tile
          if(tileNoise(x,y,7.31) < 0.07){
            const flicker = 0.6+0.4*Math.sin(now*0.006 + x*3.1 + y*1.7);
            const fx = tileX+t/2, fy = tileY+t+faceH*0.42;
            const tg = ctx.createRadialGradient(fx,fy,0, fx,fy,t*1.6);
            tg.addColorStop(0, 'rgba('+biome.torch+','+(0.35*flicker)+')');
            tg.addColorStop(0.5, 'rgba('+biome.torch+','+(0.14*flicker)+')');
            tg.addColorStop(1, 'rgba('+biome.torch+',0)');
            ctx.fillStyle = tg;
            ctx.fillRect(fx-t*1.6, fy-t*1.6, t*3.2, t*3.2);
            ctx.fillStyle = 'rgba('+biome.torch+',0.9)';
            ctx.beginPath(); ctx.arc(fx, fy, 1.8+flicker*0.6, 0, Math.PI*2); ctx.fill();
          }
        }
      }
      if(c==='>'){
        if(visibleNow){
          const pulse = 0.5+0.5*Math.sin(now*0.003);
          const glow = ctx.createRadialGradient(tileX+t/2,tileY+t/2,0, tileX+t/2,tileY+t/2,t*0.9);
          glow.addColorStop(0, 'rgba('+hexToRgb(biome.accent)+','+(0.22+0.15*pulse)+')');
          glow.addColorStop(1, 'rgba(201,161,90,0)');
          ctx.fillStyle = glow;
          ctx.fillRect(tileX-t*0.5, tileY-t*0.5, t*2, t*2);
        }
        ctx.fillStyle = visibleNow ? biome.accent : '#6b5a35';
        ctx.font = (t*0.6)+'px monospace';
        ctx.fillText('>', tileX+t*0.28, tileY+t*0.72);
      }
    }
  }
  // a soft warm pool of light around the player, within the dark
  drawTorchlight(ctx, offX+state.player.tileX*t+t/2, offY+state.player.tileY*t+t/2, t*3.2);
  // items ... only drawn while inside current vision radius
  for(const it of dungeon.items){
    if(!tileVisibleNow(it.x,it.y)) continue;
    const px = offX+it.x*t, py = offY+it.y*t;
    if(it.type==='potion'){
      ctx.fillStyle = '#7fbf8f';
      ctx.fillRect(px+t*0.35, py+t*0.25, t*0.3, t*0.5);
    } else if(it.type==='shard'){
      ctx.save();
      ctx.translate(px+t/2, py+t/2);
      ctx.rotate(Math.PI/4);
      ctx.fillStyle = '#c9a15a';
      ctx.fillRect(-t*0.2,-t*0.2,t*0.4,t*0.4);
      ctx.restore();
    } else if(it.type==='trinket'){
      ctx.strokeStyle = '#8a5fce';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(px+t/2, py+t/2, t*0.22, 0, Math.PI*2);
      ctx.stroke();
    }
  }
  // enemies ... only drawn while inside current vision radius
  for(const e of dungeon.enemies){
    if(!e.alive){ e.animX=undefined; continue; }
    if(!tileVisibleNow(e.x,e.y)) continue;
    noteEnemySeen(e.name);
    lerpVisual(e, 0.4);
    const ex = offX+e.animX*t, ey = offY+e.animY*t;
    const ebob = idleBobPx(e, (e.x*3+e.y*7)) + walkBouncePx(e);
    drawGroundShadow(ctx, ex+t/2, ey+t*0.82, t);
    drawSprite(ctx, ex, ey+ebob, e.spr, e.pal, t/8);
    ctx.fillStyle='#000'; ctx.fillRect(ex, ey-5, t, 3);
    ctx.fillStyle= (e.boss||e.miniboss)? '#b4453a':'#7fbf8f';
    ctx.fillRect(ex, ey-5, t*(e.hp/e.maxHp), 3);
    if(e.ranged){
      ctx.fillStyle='rgba(154,160,200,0.7)'; ctx.font='8px monospace';
      ctx.fillText('*ranged*', ex-4, ey-8);
    }
  }
  // player (smoothed motion)
  lerpVisual(state.player, 0.45);
  const pxp = offX+state.player.animX*t, pyp = offY+state.player.animY*t;
  drawGroundShadow(ctx, pxp+t/2, pyp+t*0.82, t);
  drawSprite(ctx, pxp, pyp+idleBobPx(state.player,0.6)+walkBouncePx(state.player), SPR_PLAYER, PAL_PLAYER, t/8);

  updateFx();
  drawFx();
  endShakeTransform(shaking);
  drawVignette(ctx, canvas2d.width, canvas2d.height);

  ctx.fillStyle='rgba(201,161,90,0.85)';
  ctx.font='11px "IBM Plex Mono"';
  const floorLabel = state.floor===3 ? ' (RECORDS AUDIT)' : state.floor===5 ? ' (REPOSSESSION NOTICE)' : state.floor===8 ? ' (FINAL NOTICE)' : '';
  const deptName = biome.name;
  const diffTag = state.difficulty==='nightmare' ? '  [NIGHTMARE]' : state.difficulty==='hardcore' ? '  [HARDCORE]' : '';
  ctx.fillText(deptName+' ... FLOOR '+state.floor+floorLabel+'   Lv.'+state.player.level+' ('+state.player.xp+'/'+xpToNext(state.player.level)+' XP)'+diffTag, offX, 20);

  drawMinimap();
}
function dimColor(hex){
  // crude darken for "remembered but not currently visible" fog tiles
  const n = parseInt(hex.slice(1),16);
  const r = Math.floor(((n>>16)&255)*0.45), g = Math.floor(((n>>8)&255)*0.45), b = Math.floor((n&255)*0.45);
  return 'rgb('+r+','+g+','+b+')';
}
function drawMinimap(){
  const mmSize = 3, pad = 10;
  const mx = canvas2d.width - dungeon.w*mmSize - pad - 4;
  const my = pad + 4;
  ctx.fillStyle='rgba(0,0,0,0.55)';
  ctx.fillRect(mx-4, my-4, dungeon.w*mmSize+8, dungeon.h*mmSize+8);
  for(let y=0;y<dungeon.h;y++){
    for(let x=0;x<dungeon.w;x++){
      if(!dungeon.seen[y][x]) continue;
      const c = dungeon.grid[y][x];
      ctx.fillStyle = c==='#' ? '#2a2f42' : (c==='>' ? '#c9a15a' : '#4a5068');
      ctx.fillRect(mx+x*mmSize, my+y*mmSize, mmSize-0.5, mmSize-0.5);
    }
  }
  ctx.fillStyle='#e8e1d0';
  ctx.fillRect(mx+state.player.tileX*mmSize-1, my+state.player.tileY*mmSize-1, mmSize+1, mmSize+1);
}

// ---------------------------------------------------------------------
// 5. MOVEMENT / COMBAT
// ---------------------------------------------------------------------
function tryMove(dx,dy){
  const now = performance.now();
  if(now - state.lastMoveT < state.moveCd) return;
  state.lastMoveT = now;

  if(state.mode==='HUB'){
    const nx = state.player.tileX+dx, ny = state.player.tileY+dy;
    const npc = npcAt(nx,ny);
    if(npc){ talkToNpc(npc); return; }
    if(nx===hub.vault.x && ny===hub.vault.y){
      if(state.vaultSolved){
        openDialogue('THE VAULT', ['The lock has already given up its secret. Nothing more to take.'], null, ()=>{});
      } else {
        enterPuzzle();
      }
      return;
    }
    if(nx===hub.archive.x && ny===hub.archive.y){
      if(state.archiveSolved){
        openDialogue('THE ARCHIVE', ['Every switch still lit, just as you left them.'], null, ()=>{});
      } else {
        enterArchive();
      }
      return;
    }
    if(nx===hub.memory.x && ny===hub.memory.y){
      if(state.shards.photo){
        enterMemory();
      } else {
        openDialogue('MEMORY BOOTH', ['A brass slot, waiting for a photograph that does not exist yet.', 'Perhaps something in Filing still remembers your face.'], null, ()=>{});
      }
      return;
    }
    if(hubTileAt(nx,ny)==='D'){
      enterDungeon();
      return;
    }
    if(nx===hub.subbasement.x && ny===hub.subbasement.y){
      enterSubbasement();
      return;
    }
    if(!hubSolid(nx,ny)){
      state.player.tileX = nx; state.player.tileY = ny;
    }
    return;
  }

  if(state.mode==='DUNGEON'){
    const nx = state.player.tileX+dx, ny = state.player.tileY+dy;
    if(dungeonSolid(nx,ny)) return;
    const enemy = enemyAt(nx,ny);
    if(enemy){
      if(overtimeReady()){ presentLimitBreakChoice(enemy); return; }
      playerAttack(enemy);
      enemyTurn();
      return;
    }
    state.player.tileX = nx; state.player.tileY = ny;
    checkDungeonTile(nx,ny);
    updateVisibility();
    if(state.mode==='DUNGEON') enemyTurn(); // a trinket pickup may have opened a choice dialogue ... if so, its turn resolves after the choice instead
    return;
  }

  if(state.mode==='ARCHIVE'){
    archiveCursor.x = Math.max(0, Math.min(2, archiveCursor.x+dx));
    archiveCursor.y = Math.max(0, Math.min(2, archiveCursor.y+dy));
  }
}

function dashMove(){
  // dash 2 tiles in last-pressed direction
  const dirs = [
    ['w',[0,-1]],['arrowup',[0,-1]],['s',[0,1]],['arrowdown',[0,1]],
    ['a',[-1,0]],['arrowleft',[-1,0]],['d',[1,0]],['arrowright',[1,0]],
  ];
  let dir = [0,1];
  for(const [k,v] of dirs){ if(state.keys[k]){ dir=v; break; } }
  let nx = state.player.tileX + dir[0]*2, ny = state.player.tileY + dir[1]*2;
  if(dungeonSolid(nx,ny)){ nx = state.player.tileX+dir[0]; ny = state.player.tileY+dir[1]; }
  if(!dungeonSolid(nx,ny)){
    state.player.tileX = nx; state.player.tileY = ny;
    state.player.dashCd = 8;
    checkDungeonTile(nx,ny);
    updateVisibility();
    flashBanner('HOLLOW STEP');
    playSfx('dash');
  }
}

function useEmberAbility(){
  if(!state.shards.ember || state.player.abilityCd.ember>0) return;
  const dirs = [[0,-1],[0,1],[-1,0],[1,0]];
  let hitAny = false;
  const dmg = Math.max(1, 2 + Math.floor((state.player.level-1)/2) + state.skills.procedure);
  dirs.forEach(([dx,dy])=>{
    const e = enemyAt(state.player.tileX+dx, state.player.tileY+dy);
    if(e){ hitAny = true; applyDamageToEnemy(e, dmg, {}); }
  });
  state.player.abilityCd.ember = 5;
  flashBanner(hitAny ? 'SCORCHED LEDGER ... every adjacent file burns.' : 'SCORCHED LEDGER ... nothing in reach caught fire.');
  screenFlash('#b4453a', 0.25);
  playSfx('dash');
  if(state.mode==='DUNGEON') enemyTurn();
}
function useTapeAbility(){
  if(!state.shards.tape || state.player.abilityCd.tape>0) return;
  const dirs = [[0,-1],[0,1],[-1,0],[1,0]];
  let hitAny = false;
  dirs.forEach(([dx,dy])=>{
    const e = enemyAt(state.player.tileX+dx, state.player.tileY+dy);
    if(e){ hitAny = true; e.stunned = true; }
  });
  state.player.abilityCd.tape = 6;
  flashBanner(hitAny ? 'FILE EVERYTHING ... nearby forms are bound in procedure.' : 'FILE EVERYTHING ... no one nearby to bind.');
  screenFlash('#c9a15a', 0.2);
  playSfx('shard');
  if(state.mode==='DUNGEON') enemyTurn();
}

function checkDungeonTile(x,y){
  const idx = dungeon.items.findIndex(it=>it.x===x&&it.y===y);
  if(idx>=0){
    const it = dungeon.items[idx];
    const {t,offX,offY} = dungeonMetrics();
    const px = offX+x*t+t/2, py = offY+y*t+t/2;
    if(it.type==='potion'){
      state.player.hp = Math.min(maxHp(), state.player.hp+20);
      flashBanner('+20 HP ... a form, correctly filed');
      playSfx('pickup');
      spawnParticles(px,py,'#7fbf8f',8);
    } else if(it.type==='shard'){
      state.shards[it.shard] = true;
      flashBanner('SHARD RECOVERED: '+SHARD_DEFS[it.shard].name.toUpperCase());
      playSfx('shard');
      spawnParticles(px,py,'#c9a15a',14);
      writeSave();
      if(Object.values(state.shards).filter(Boolean).length===1) achieve('firstshard','First Shard Recovered');
    } else if(it.type==='trinket'){
      playSfx('pickup');
      spawnParticles(px,py,'#8a5fce',10);
      offerTrinket(it.trinket);
    } else if(it.type==='item'){
      addItemToInventory(it.item);
      flashBanner('ACQUIRED: '+ITEM_DEFS[it.item].name.toUpperCase());
      playSfx('pickup');
      spawnParticles(px,py,'#e8e1d0',10);
      writeSave();
    }
    dungeon.items.splice(idx,1);
  }
  if(dungeon.grid[y][x]==='>'){
    if(state.floor===3 && !state.bossDefeated){
      flashBanner('The stairwell is sealed until the Auditor is answered for.');
      return;
    }
    if(state.floor===5 && !state.minibossDefeated){
      flashBanner('The stairwell is sealed until the Repossessor is answered for.');
      return;
    }
    if(state.floor===8 && !state.finalBossDefeated){
      flashBanner('The stairwell is sealed until the Chief Auditor is answered for.');
      return;
    }
    state.floor++;
    playSfx('door');
    genDungeon(state.floor);
    locationLabel = getBiome(state.floor).name;
    updateAmbientPitch(getBiome(state.floor).ambientHz);
    el.floorTag.textContent = 'FLOOR '+state.floor;
    if(state.floor > stats.deepestFloor){ stats.deepestFloor = state.floor; writeStats(); }
    if(state.floor >= 5) achieve('floor5','Reached the Fifth Floor');
    if(state.floor >= 8) achieve('floor8','Reached the Deep Archive');
    if(state.floor===3 && !state._floor3IntroDone){
      state._floor3IntroDone = true;
      setTimeout(()=>openDialogue('THE AUDITOR', [
        "Something down this hall has been counting your steps since you arrived.",
        "Auditors don't judge ... that's a different office, a higher one. They tally. Everything you did, and everything you meant to and never got around to.",
        "It will ask you for the difference. You won't like the number. Answer for it anyway.",
      ], null, ()=>{}), 250);
    }
    if(state.floor===5 && !state._floor5IntroDone){
      state._floor5IntroDone = true;
      setTimeout(()=>openDialogue('SOMETHING HEAVIER', [
        "This far down, the paperwork stops pretending to be paperwork.",
        "The Repossessor doesn't take souls. It takes the things you were still using ... time, chances, people who waited on you. It's already decided you're overdue.",
      ], null, ()=>{}), 250);
    }
    if(state.floor===8 && !state._floor8IntroDone){
      state._floor8IntroDone = true;
      setTimeout(()=>openDialogue('THE CHIEF AUDITOR', [
        "Every stamp you collected, every switch you threw, every shard you dragged up out of the dark ... it all led to one office, and this is it.",
        "The Chief Auditor doesn't work from a ledger. It IS the ledger ... every unfinished thing you ever were, filed under your own name and left open.",
        "Close it, if you can. Most people never get the chance to try.",
      ], null, ()=>{}), 250);
    }
  }
}

function offerTrinket(key){
  const def = TRINKET_DEFS[key];
  const current = state.equippedTrinket ? TRINKET_DEFS[state.equippedTrinket] : null;
  const text = current
    ? "A trinket: "+def.name+". "+def.desc+" You're already carrying "+current.name+" ... swap it in?"
    : "A trinket: "+def.name+". "+def.desc+" Equip it?";
  const resolveTurn = ()=>{ if(state.mode==='DUNGEON'){ enemyTurn(); } };
  openDialogueChoices('FOUND SOMETHING', text, [
    {label:'Equip it.', next: ()=>{ state.equippedTrinket = key; writeSave(); flashBanner('EQUIPPED: '+def.name.toUpperCase()); updateHud(); resolveTurn(); }},
    {label:'Leave it.', next: resolveTurn},
  ]);
}

function playerAttack(enemy){
  let dmg = 3 + Math.floor(Math.random()*3) + (state.player.level-1) + trinketBonus('dmg') + state.skills.procedure;
  if(state.shards.ember) dmg += 2;
  if(state.player.weakenTurns>0) dmg = Math.max(1, dmg-2);
  const critChance = 0.15 + trinketBonus('crit') + state.skills.precision*0.03;
  let crit = Math.random() < critChance;
  if(crit) dmg = Math.round(dmg*1.6);
  gainLimit(crit ? 14 : 8);
  applyDamageToEnemy(enemy, dmg, {crit});
}

// Shared by both the normal attack and the Overtime Clause burst below ...
// handles the hit fx, Red Tape proc, and every enemy-death branch (bosses,
// minibosses, shard drops, XP, the works) in one place.
function applyDamageToEnemy(enemy, dmg, opts){
  opts = opts || {};
  const crit = !!opts.crit;
  enemy.hp -= dmg;
  if(!opts.noStamp) spawnStamp(crit);
  playSfx(crit?'crit':'hit');
  screenShake(crit?4:2, crit?10:5);
  const {t,offX,offY} = dungeonMetrics();
  const ex = offX+(enemy.animX!==undefined?enemy.animX:enemy.x)*t+t/2, ey = offY+(enemy.animY!==undefined?enemy.animY:enemy.y)*t;
  spawnParticles(ex, ey, crit?'#b4453a':'#e8e1d0', crit?10:5);
  spawnFloater(ex-6, ey, '-'+dmg, crit?'#ff6b5a':'#e8e1d0');
  if(state.shards.tape && Math.random()<0.3 && enemy.hp>0){
    enemy.stunned = true;
    flashBanner('RED TAPE ... the '+enemy.name+' is bound in procedure.');
  }
  if(enemy.hp<=0){
    enemy.alive = false;
    stats.kills++; writeStats();
    if(stats.kills===1) achieve('firstblood','First Blood ... your first dismissal');
    if(enemy.boss){
      state.bossDefeated = true;
      state.shards.photo = true;
      writeSave();
      flashBanner('THE AUDITOR IS SILENCED. A photograph falls from its ledger.');
      grantXp(30);
      screenShake(8,20); screenFlash('#b4453a',0.3); playSfx('win');
      achieve('boss','The Auditor Silenced');
    } else if(enemy.miniboss){
      state.minibossDefeated = true;
      if(enemy.dropShard && !state.shards[enemy.dropShard]){
        state.shards[enemy.dropShard] = true;
        flashBanner('THE REPOSSESSOR YIELDS: '+SHARD_DEFS[enemy.dropShard].name.toUpperCase());
      } else {
        flashBanner('THE REPOSSESSOR IS DISMISSED.');
      }
      writeSave();
      grantXp(15);
      screenShake(6,16); playSfx('win');
      achieve('miniboss','The Repossessor Answered For');
    } else if(enemy.finalboss){
      state.finalBossDefeated = true;
      writeSave();
      flashBanner('THE CHIEF AUDITOR CLOSES THE FILE, FOR GOOD.');
      grantXp(60);
      screenShake(10,26); screenFlash('#e0c05a',0.4); playSfx('win');
      achieve('finalboss','The Chief Auditor Answered For');
      if(state.memoryDone){ setTimeout(()=>showWin(), 1400); }
    } else if(enemy.joke){
      const lines = [
        'The Intern quits on the spot. Somehow that felt worse than winning.',
        'The Intern was going to file a complaint. Was.',
        "The Intern's LinkedIn already says \"former.\"",
      ];
      flashBanner(lines[Math.floor(Math.random()*lines.length)]);
      grantXp(3+state.floor);
      achieve('intern','Fired the Intern');
    } else {
      flashBanner('The '+enemy.name+' is dismissed with prejudice.');
      grantXp(3+state.floor);
    }
  }
}

// ---------------------------------------------------------------------
// 5b. OVERTIME CLAUSE ... the limit-break analogue. The gauge fills from
// dealing and taking damage; once full, the next attack becomes a
// devastating burst that splashes to adjacent enemies and refunds some
// HP, then empties out again.
// ---------------------------------------------------------------------
function gainLimit(amount){
  if(state.player.limit >= state.player.limitMax) return;
  const was = state.player.limit;
  state.player.limit = Math.min(state.player.limitMax, state.player.limit + amount);
  if(was < state.player.limitMax && state.player.limit >= state.player.limitMax){
    flashBanner('OVERTIME CLAUSE READY ... your next strike collects in full.');
    playSfx('blip');
  }
  updateHud();
}
function overtimeReady(){ return state.player.limit >= state.player.limitMax; }
function overtimeAttack(enemy){
  state.player.limit = 0;
  achieve('overtime','Invoked the Overtime Clause');
  flashBanner('OVERTIME CLAUSE INVOKED ... every hour, all at once.');
  screenShake(10,24); screenFlash('#e0c05a', 0.4); playSfx('overtime');
  const dmg = 10 + Math.floor(Math.random()*5) + (state.player.level-1)*2 + trinketBonus('dmg')*2 + (state.shards.ember?4:0);
  applyDamageToEnemy(enemy, dmg, {crit:true});
  for(const other of dungeon.enemies){
    if(!other.alive || other===enemy) continue;
    if(Math.abs(other.x-enemy.x)+Math.abs(other.y-enemy.y) <= 1){
      applyDamageToEnemy(other, Math.round(dmg*0.55), {noStamp:true});
    }
  }
  const healAmt = Math.round(maxHp()*0.25);
  if(healAmt>0 && state.player.hp>0){
    state.player.hp = Math.min(maxHp(), state.player.hp+healAmt);
    const {t,offX,offY} = dungeonMetrics();
    const px = offX+state.player.tileX*t+t/2, py = offY+state.player.tileY*t;
    spawnFloater(px-6, py, '+'+healAmt, '#7fbf8f');
  }
  updateHud();
}

// A second Overtime Clause move ... trades the single hard-hitting strike
// and self-heal for a wider, weaker sweep that guarantees Red Tape on
// every visible enemy regardless of whether the shard's been found.
// Same gauge, same one-shot spend; which to reach for is the player's call.
function auditSweep(primary){
  state.player.limit = 0;
  achieve('overtime','Invoked the Overtime Clause');
  flashBanner('AUDIT SWEEP ... every open case in the room, closed at once.');
  screenShake(9,22); screenFlash('#7fbf8f', 0.35); playSfx('overtime');
  const dmg = 6 + Math.floor(Math.random()*4) + (state.player.level-1) + trinketBonus('dmg') + (state.shards.ember?2:0);
  let hitCount = 0;
  for(const e of dungeon.enemies){
    if(!e.alive || !tileVisibleNow(e.x,e.y)) continue;
    applyDamageToEnemy(e, dmg, {noStamp: e!==primary});
    if(e.hp>0) e.stunned = true; // guaranteed Red Tape, independent of the shard
    hitCount++;
  }
  if(hitCount>1) flashBanner('AUDIT SWEEP struck '+hitCount+' targets ... all bound in procedure.');
  updateHud();
}

// Presented the instant the gauge caps out on a melee swing ... a small,
// FFVII-limit-break-flavored fork rather than an auto-fired attack.
function presentLimitBreakChoice(enemy){
  openDialogueChoices('OVERTIME CLAUSE ... READY',
    "The gauge is full. Collect it your way: one devastating strike with a refund of vitality, or a sweep that leaves every open case in the room a little worse for wear.",
    [
      {label:'SEVERANCE ... heavy single strike + self-heal', next: ()=>{ overtimeAttack(enemy); enemyTurn(); }},
      {label:'AUDIT SWEEP ... hits all visible enemies, guaranteed Red Tape', next: ()=>{ auditSweep(enemy); enemyTurn(); }},
    ]
  );
}

function difficultyMultiplier(){
  if(state.difficulty==='nightmare') return 2;
  if(state.difficulty==='hardcore') return 1.5;
  return 1;
}

function enemyTurn(){
  if(state.player.dashCd>0) state.player.dashCd--;
  if(state.player.abilityCd.ember>0) state.player.abilityCd.ember--;
  if(state.player.abilityCd.tape>0) state.player.abilityCd.tape--;
  if(state.player.weakenTurns>0) state.player.weakenTurns--;
  for(const e of dungeon.enemies){
    if(!e.alive) continue;
    if(e.stunned){ e.stunned=false; continue; } // Red Tape: skip this enemy's turn entirely
    if(e.slow){ e._skip = !e._skip; if(e._skip) continue; } // Repo Man acts every other turn
    enemyAct(e);
    if(state.mode==='GAMEOVER') return;
    if(e.fast && e.alive){ enemyAct(e); if(state.mode==='GAMEOVER') return; } // Filing Rat: acts twice per player turn
  }
  updateHud();
}

// A single enemy's action for one beat of initiative ... factored out of
// enemyTurn so "fast" enemies (Filing Rats) can be run through it twice
// per player turn without duplicating the whole loop body.
function enemyAct(e){
  if(e.finalboss && !e.enraged && e.hp <= e.maxHp*0.5){
    e.enraged = true;
    e.dmg = Math.round(e.dmg*1.4);
    flashBanner('THE CHIEF AUDITOR REVOKES ALL PENDING APPEALS.');
    screenShake(7,18); screenFlash('#e0c05a',0.3);
    const {t,offX,offY} = dungeonMetrics();
    spawnParticles(offX+e.x*t+t/2, offY+e.y*t+t/2, '#e0c05a', 16);
  }

  const ddx = state.player.tileX - e.x, ddy = state.player.tileY - e.y;
  const dist = Math.abs(ddx)+Math.abs(ddy);
  const sameLine = (e.x===state.player.tileX || e.y===state.player.tileY);

  if(e.ranged && sameLine && dist<=5 && dist>1){
    let dmg = Math.max(1, Math.round((e.dmg - (state.shards.weight?1:0)) * difficultyMultiplier()));
    applyDamageToPlayer(dmg);
    return;
  }
  if(dist===1){
    let dmg = Math.max(1, Math.round((e.dmg - (state.shards.weight?1:0)) * difficultyMultiplier()));
    applyDamageToPlayer(dmg);
    if(state.mode==='GAMEOVER') return;
    if(e.weakens && state.player.weakenTurns<=0){
      state.player.weakenTurns = 3;
      flashBanner('NOTARIZED INSUFFICIENT ... your strikes land lighter for a few turns.');
    }
    if(e.drains){
      const healAmt = Math.max(1, Math.round(dmg*0.5));
      e.hp = Math.min(e.maxHp, e.hp+healAmt);
      const {t,offX,offY} = dungeonMetrics();
      const ex2 = offX+e.x*t+t/2, ey2 = offY+e.y*t;
      spawnFloater(ex2-6, ey2, '+'+healAmt, '#e0c05a');
      spawnParticles(ex2, ey2, '#e0c05a', 6);
    }
  } else if(dist<=6){
    const sx = Math.sign(ddx), sy = Math.sign(ddy);
    let nx=e.x, ny=e.y;
    if(Math.abs(ddx)>Math.abs(ddy)) nx = e.x+sx; else ny = e.y+sy;
    if(!dungeonSolid(nx,ny) && !enemyAt(nx,ny) && !(nx===state.player.tileX&&ny===state.player.tileY)){
      e.x=nx; e.y=ny;
    }
  } else if(Math.random()<0.3){
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    const d = dirs[Math.floor(Math.random()*4)];
    const nx=e.x+d[0], ny=e.y+d[1];
    if(!dungeonSolid(nx,ny) && !enemyAt(nx,ny)) { e.x=nx; e.y=ny; }
  }
}

function spawnPlayerHitFx(dmg){
  const {t,offX,offY} = dungeonMetrics();
  const px = offX+(state.player.animX!==undefined?state.player.animX:state.player.tileX)*t+t/2;
  const py = offY+(state.player.animY!==undefined?state.player.animY:state.player.tileY)*t;
  spawnParticles(px, py, '#b4453a', 7);
  spawnFloater(px-6, py, '-'+dmg, '#ff8a7a');
  screenShake(5, 8);
}

function applyDamageToPlayer(dmg){
  if(state.player.invincibleUntil && Date.now() < state.player.invincibleUntil){
    flashBanner('untouchable ... for now');
    return;
  }
  dmg = Math.max(1, dmg - state.skills.tenacity);
  state.player.hp -= dmg;
  spawnPlayerHitFx(dmg);
  gainLimit(Math.round(dmg*1.4));
  if(state.player.hp<=0){
    if(state.shards.wind && !state.usedSecondWind && state.difficulty==='standard'){
      state.usedSecondWind = true;
      state.player.hp = 1;
      flashBanner('SECOND WIND ... the paperwork is not yet complete.');
      playSfx('hurt');
    } else {
      gameOver();
    }
  } else {
    playSfx('hurt');
  }
}

function spawnStamp(crit){
  el.stamp.textContent = crit? 'DENIED' : 'NOTED';
  el.stamp.style.transition='none';
  el.stamp.style.opacity='1';
  el.stamp.style.transform='translate(-50%,-50%) rotate(-12deg) scale(1.15)';
  requestAnimationFrame(()=>{
    el.stamp.style.transition='opacity .6s, transform .6s';
    el.stamp.style.opacity='0';
    el.stamp.style.transform='translate(-50%,-50%) rotate(-12deg) scale(1)';
  });
}

function flashBanner(text){
  el.banner.textContent = text;
  el.banner.style.opacity='1';
  clearTimeout(flashBanner._t);
  flashBanner._t = setTimeout(()=>{ el.banner.style.opacity='0'; }, 2600);
}

function gameOver(){
  state.mode='GAMEOVER';
  stats.deaths++; writeStats();
  playSfx('gameover');
  screenFlash('#b4453a', 0.5);
  showOverlayGameOver();
}

function specialDateLine(){
  const now = new Date();
  const m = now.getMonth()+1, d = now.getDate();
  if(m===2 && d===20) return "Also ... happy birthday, by the way. Loz probably has something planned. Let her.";
  if(m===6 && d===16) return "Also ... it's Loz's birthday today. Go find her before you finish this floor.";
  if(m===7 && d===21) return "Also ... it's LittleLove's birthday today. Go be there instead of reading dialogue in a video game.";
  if(m===9 && d===26) return "Also, September twenty-sixth. Whoever built this remembers that date better than most.";
  return null;
}

    return;
  }
  if(key==='concierge' && state.inventory.includes('workingstamp') && !state.subbasementUnlocked){
    openDialogueChoices('THE CONCIERGE',
      "Is that... you got the old stamp working again? I haven't seen that used since before my time. Present it properly, and I'll have to take you seriously.",
      [
        {label:'Present the Stamp of Approval.', next: ()=>{
          state.inventory = state.inventory.filter(k=>k!=='workingstamp');
          state.subbasementUnlocked = true;
          writeSave();
          flashBanner('AUTHORIZED ... the hatch by the east wall unseals.');
          openDialogue('THE CONCIERGE', ["Well. Properly stamped is properly stamped. There's a hatch near the east wall that's been sealed longer than either of us. It's yours now, for what it's worth."], null, ()=>{});
        }},
        {label:"Not yet.", next: ()=>{}},
      ]
    );
    return;
  }
  if(key==='clerk'){
    const base = typeof NPC_LINES.clerk.lines === 'function' ? NPC_LINES.clerk.lines() : NPC_LINES.clerk.lines;
    openDialogue(NPC_LINES.clerk.speaker, base, null, ()=>{
      if(state.duelWon && !state.rivalDuelWon){
        openDialogueChoices('FELLOW CLERK, DESK 14',
          "Word of your little victory reached the Inspector upstairs. They don't lose arguments ... but they've asked for you by name, if you're brave enough.",
          [
            {label:'Face the Inspector.', next: ()=>startDuel(true)},
            {label:"I'll pass, for now.", next: ()=>{}},
          ]
        );
        return;
      }
      const offer = state.duelWon
        ? "Care for a rematch? No stakes this time ... it just passes the shift."
        : "Fancy trading complaints for practice? Loser buys the coffee, if either of us could still drink it.";
      openDialogueChoices('FELLOW CLERK, DESK 14', offer, [
        {label:'Trade complaints.', next: ()=>startDuel()},
        {label:'Maybe later.', next: ()=>{}},
      ]);
    });
    return;
  }
  const d = NPC_LINES[key];
  const lines = typeof d.lines === 'function' ? d.lines() : d.lines;
  openDialogue(d.speaker, lines, null, ()=>{});
}

function openDialogue(speaker, lines, choices, onDone){
  state.prevMode = state.mode;
  state.dialogue = { speaker, lines: lines.slice(), idx:0, choices, onDone };
  state.mode = 'DIALOGUE';
  el.dialogue.style.display='block';
  el.dlgChoices.style.display='none';
  renderDialogueLine();
}
function openDialogueChoices(speaker, text, choices){
  state.prevMode = state.mode;
  state.dialogue = { speaker, lines:[text], idx:0, choices, onDone:null, showChoicesAfter:true };
  state.mode = 'DIALOGUE';
  el.dialogue.style.display='block';
  el.dlgChoices.style.display='none';
  renderDialogueLine();
}
function renderDialogueLine(){
  const d = state.dialogue;
  el.dlgSpeaker.textContent = d.speaker;
  el.dlgBody.textContent = d.lines[d.idx];
  const isLast = d.idx === d.lines.length-1;
  if(isLast && d.choices){
    el.dlgHint.style.display='none';
    el.dlgChoices.style.display='flex';
    el.dlgChoices.innerHTML='';
    d.choices.forEach(c=>{
      const b = document.createElement('div');
      b.className='choice'; b.textContent=c.label;
      b.onclick = ()=>{ closeDialogue(); c.next && c.next(); };
      el.dlgChoices.appendChild(b);
    });
  } else {
    el.dlgHint.style.display='block';
    el.dlgChoices.style.display='none';
  }
}
function advanceDialogue(){
  const d = state.dialogue;
  if(!d) return;
  playSfx('blip');
  if(d.idx < d.lines.length-1){
    d.idx++;
    renderDialogueLine();
    return;
  }
  if(d.choices) return; // wait for click
  closeDialogue();
  d.onDone && d.onDone();
}
function closeDialogue(){
  el.dialogue.style.display='none';
  state.mode = state.prevMode;
  state.dialogue = null;
}

// 7. PUZZLE (Matter.js physics vault)
// ---------------------------------------------------------------------
let puzzleEngine=null, puzzleWorld=null, puzzlePlayer=null, puzzleCrate=null, puzzlePlate=null, puzzleSolved=false, puzzleRAF=null;

function enterPuzzle(){
  state.mode='PUZZLE';
  canvas2d.style.display='block';
  canvas3d.style.display='none';
  el.hudTop.style.display='none';
  el.controlsNote.textContent = 'WASD to push the crate onto the marked plate.';
  el.leaveBtn.style.display='block';
  puzzleSolved=false;

  puzzleEngine = Matter.Engine.create();
  puzzleWorld = puzzleEngine.world;
  puzzleWorld.gravity.y = 0;

  const W=800,H=600;
  const wallOpts = { isStatic:true, friction:0.1 };
  Matter.World.add(puzzleWorld,[
    Matter.Bodies.rectangle(W/2,10,W,20,wallOpts),
    Matter.Bodies.rectangle(W/2,H-10,W,20,wallOpts),
    Matter.Bodies.rectangle(10,H/2,20,H,wallOpts),
    Matter.Bodies.rectangle(W-10,H/2,20,H,wallOpts),
  ]);

  puzzlePlayer = Matter.Bodies.circle(150,300,18,{ friction:0.02, frictionAir:0.15, restitution:0.1 });
  puzzleCrate = Matter.Bodies.rectangle(400,300,60,60,{ friction:0.05, frictionAir:0.25, density:0.004, restitution:0 });
  Matter.World.add(puzzleWorld,[puzzlePlayer,puzzleCrate]);

  puzzlePlate = { x:640, y:300, r:50 };

  function loop(){
    const speed=4;
    let vx=0,vy=0;
    if(state.keys['w']||state.keys['arrowup']) vy=-speed;
    if(state.keys['s']||state.keys['arrowdown']) vy=speed;
    if(state.keys['a']||state.keys['arrowleft']) vx=-speed;
    if(state.keys['d']||state.keys['arrowright']) vx=speed;
    Matter.Body.setVelocity(puzzlePlayer,{x:vx,y:vy});

    Matter.Engine.update(puzzleEngine, 1000/60);
    drawPuzzle();

    if(!puzzleSolved){
      const dx = puzzleCrate.position.x-puzzlePlate.x, dy = puzzleCrate.position.y-puzzlePlate.y;
      const d = Math.sqrt(dx*dx+dy*dy);
      const speedMag = Math.hypot(puzzleCrate.velocity.x, puzzleCrate.velocity.y);
      if(d < puzzlePlate.r*0.5 && speedMag < 0.5){
        puzzleSolved = true;
        solvePuzzle();
      }
    }
    if(state.mode==='PUZZLE') puzzleRAF = requestAnimationFrame(loop);
  }
  puzzleRAF = requestAnimationFrame(loop);
}

function drawPuzzle(){
  ctx.fillStyle='#0b0e14'; ctx.fillRect(0,0,800,600);
  ctx.fillStyle='rgba(201,161,90,0.8)'; ctx.font='11px "IBM Plex Mono"';
  ctx.fillText('THE VAULT ... balance the ledger. Push the crate onto the brass seal.', 20, 24);

  // plate
  ctx.beginPath();
  ctx.arc(puzzlePlate.x,puzzlePlate.y,puzzlePlate.r,0,Math.PI*2);
  ctx.strokeStyle = puzzleSolved? '#7fbf8f':'#c9a15a';
  ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle = puzzleSolved? 'rgba(127,191,143,0.15)':'rgba(201,161,90,0.08)';
  ctx.fill();

  // crate
  ctx.save();
  ctx.translate(puzzleCrate.position.x, puzzleCrate.position.y);
  ctx.rotate(puzzleCrate.angle);
  ctx.fillStyle='#5a4530';
  ctx.fillRect(-30,-30,60,60);
  ctx.strokeStyle='#c9a15a'; ctx.lineWidth=2;
  ctx.strokeRect(-30,-30,60,60);
  ctx.beginPath(); ctx.moveTo(-30,-30); ctx.lineTo(30,30); ctx.moveTo(30,-30); ctx.lineTo(-30,30); ctx.stroke();
  ctx.restore();

  // player
  ctx.beginPath();
  ctx.arc(puzzlePlayer.position.x,puzzlePlayer.position.y,18,0,Math.PI*2);
  ctx.fillStyle='#e8e1d0'; ctx.fill();
  ctx.fillStyle='#0b0e14'; ctx.font='10px monospace';
  ctx.fillText('YOU', puzzlePlayer.position.x-11, puzzlePlayer.position.y+3);

  if(puzzleSolved){
    ctx.fillStyle='#7fbf8f'; ctx.font='16px "Playfair Display"';
    ctx.fillText('BALANCED.', 340, 60);
  }
}

function solvePuzzle(){
  flashBanner('THE VAULT UNLOCKS.');
  playSfx('puzzle');
  achieve('vault','The Vault Balanced');
  setTimeout(()=>{
    state.vaultSolved = true;
    state.maxHpBonus += 15;
    state.shards.wind = true;
    state.player.hp = Math.min(maxHp(), state.player.hp+15);
    writeSave();
    cancelAnimationFrame(puzzleRAF);
    goToHub();
    openDialogue('THE VAULT', ["The scale settles. Something in the wall clicks free.", "A shard, and fifteen pounds of case file added to your name. (+15 Max HP, SECOND WIND)"], null, ()=>{});
  }, 900);
}

// 7b. ARCHIVE (lights-out lever puzzle ... no physics engine, pure logic)
// ---------------------------------------------------------------------
let archiveGrid = [[false,false,false],[false,false,false],[false,false,false]];
let archiveCursor = {x:1,y:1};
let archiveWon = false;

function enterArchive(){
  state.mode='ARCHIVE';
  canvas2d.style.display='block';
  canvas3d.style.display='none';
  el.hudTop.style.display='none';
  el.controlsNote.textContent = 'D-pad/arrows to move the cursor, ACT/space to flip a switch.';
  el.leaveBtn.style.display='block';
  archiveGrid = [[false,false,false],[false,false,false],[false,false,false]];
  archiveCursor = {x:1,y:1};
  archiveWon = false;
  // Scramble with genuine lights-out moves so it's always solvable, and
  // never start already-solved.
  for(let i=0;i<5;i++){
    archiveFlipGroup(Math.floor(rng()*3), Math.floor(rng()*3));
  }
  if(archiveGrid.every(row=>row.every(v=>v))){
    archiveFlipGroup(0,0);
  }
}
function archiveFlipGroup(x,y){
  const flip=(fx,fy)=>{ if(fx>=0&&fx<3&&fy>=0&&fy<3) archiveGrid[fy][fx] = !archiveGrid[fy][fx]; };
  flip(x,y); flip(x-1,y); flip(x+1,y); flip(x,y-1); flip(x,y+1);
}
function archiveToggle(){
  if(archiveWon) return;
  archiveFlipGroup(archiveCursor.x, archiveCursor.y);
  playSfx('blip');
  if(archiveGrid.every(row=>row.every(v=>v))){
    archiveWon = true;
    flashBanner('THE ARCHIVE UNLOCKS.');
    playSfx('puzzle');
    achieve('archive','The Archive Illuminated');
    setTimeout(()=>{
      state.archiveSolved = true;
      state.shards.weight = true;
      state.maxHpBonus += 5;
      state.player.hp = Math.min(maxHp(), state.player.hp+5);
      writeSave();
      goToHub();
      openDialogue('THE ARCHIVE', ["Every switch catches at once ... a small, satisfying click of finality.", "A shard rolls out of a drawer that wasn't there a moment ago. (LEDGER'S WEIGHT)"], null, ()=>{});
    }, 900);
  }
}
function drawArchive(){
  ctx.fillStyle='#0b0e14'; ctx.fillRect(0,0,800,600);
  ctx.fillStyle='rgba(201,161,90,0.85)'; ctx.font='11px "IBM Plex Mono"';
  ctx.fillText('THE ARCHIVE ... light every switch. Flipping one flips its neighbors too.', 20, 24);

  const cell=100, offX=800/2-cell*1.5, offY=600/2-cell*1.5-20;
  for(let y=0;y<3;y++){
    for(let x=0;x<3;x++){
      const on = archiveGrid[y][x];
      ctx.fillStyle = on ? '#7fbf8f' : '#1c2130';
      ctx.fillRect(offX+x*cell+5, offY+y*cell+5, cell-10, cell-10);
      const isCursor = archiveCursor.x===x && archiveCursor.y===y;
      ctx.strokeStyle = isCursor ? '#c9a15a' : '#3a3f52';
      ctx.lineWidth = isCursor ? 3 : 1;
      ctx.strokeRect(offX+x*cell+5, offY+y*cell+5, cell-10, cell-10);
    }
  }
  if(archiveWon){
    ctx.fillStyle='#7fbf8f'; ctx.font='16px "Playfair Display"';
    ctx.fillText('ALL ACCOUNTS LIT.', offX+80, offY-10);
  }
}

// 8. MEMORY SEQUENCE (Three.js first-person)
// ---------------------------------------------------------------------
let memScene, memCamera, memRenderer, memYaw=0, memRAF=null, memDone=false;
function enterMemory(){
  state.mode='MEMORY';
  canvas2d.style.display='none';
  canvas3d.style.display='block';
  el.hudTop.style.display='none';
  el.controlsNote.textContent = 'W to walk forward, ←/→ to turn.';
  memDone=false; memYaw=0;

  try{
    buildMemoryScene();
  }catch(e){
    // WebGL can be unavailable or blocked entirely in some embedding
    // contexts (sandboxed previews, restrictive permissions policies).
    // Fall back to a text-only version of the same beat rather than
    // crashing the game.
    canvas3d.style.display='none';
    openDialogue('A MEMORY', [
      "The room won't render tonight ... some screens don't carry that kind of light.",
      "Still: a willow. A moon. Somewhere far off, the sound of a name.",
    ], null, ()=>{ finishMemory(); });
  }
}

function buildMemoryScene(){
  memScene = new THREE.Scene();
  memScene.fog = new THREE.FogExp2(0x0a0e1c, 0.028);
  memScene.background = new THREE.Color(0x0a0e1c);

  memCamera = new THREE.PerspectiveCamera(70, 800/600, 0.1, 150);
  memCamera.position.set(0,1.6,14);

  memRenderer = new THREE.WebGLRenderer({canvas:canvas3d, antialias:true});
  memRenderer.setSize(800,600,false);

  const amb = new THREE.AmbientLight(0x3a4560, 1.1);
  memScene.add(amb);
  const moonLight = new THREE.PointLight(0xdfe8ff, 2.4, 90);
  moonLight.position.set(0,14,-46);
  memScene.add(moonLight);

  // open field ... the corridor is gone; this is a wide night meadow
  const groundMat = new THREE.MeshStandardMaterial({color:0x10151f});
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(60,200), groundMat);
  ground.rotation.x = -Math.PI/2; ground.position.set(0,0,-40);
  memScene.add(ground);

  // a scatter of low, dark grass-tuft boxes so the field doesn't read flat
  const tuftMat = new THREE.MeshStandardMaterial({color:0x151d28});
  for(let i=0;i<80;i++){
    const tuft = new THREE.Mesh(new THREE.BoxGeometry(0.15,0.3+Math.random()*0.3,0.15), tuftMat);
    tuft.position.set((Math.random()*2-1)*13, 0.15, -Math.random()*90);
    tuft.rotation.y = Math.random()*Math.PI;
    memScene.add(tuft);
  }

  // starfield
  const starGeo = new THREE.BufferGeometry();
  const starCount = 300;
  const starPos = new Float32Array(starCount*3);
  for(let i=0;i<starCount;i++){
    starPos[i*3] = (Math.random()*2-1)*70;
    starPos[i*3+1] = 6+Math.random()*40;
    starPos[i*3+2] = -Math.random()*140;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
  const starMat = new THREE.PointsMaterial({color:0xdfe6ff, size:0.35, sizeAttenuation:true});
  memScene.add(new THREE.Points(starGeo, starMat));

  // the moon ... a bright sphere plus a soft translucent halo behind it
  const moon = new THREE.Mesh(new THREE.SphereGeometry(3.4,24,24), new THREE.MeshBasicMaterial({color:0xf5f0dd}));
  moon.position.set(2,16,-70);
  memScene.add(moon);
  const halo = new THREE.Mesh(new THREE.SphereGeometry(5.2,24,24), new THREE.MeshBasicMaterial({color:0xdfe8ff, transparent:true, opacity:0.12}));
  halo.position.copy(moon.position);
  memScene.add(halo);

  // the willow ... a trunk, a canopy mass, and a ring of drooping branches
  const willowGroup = new THREE.Group();
  const barkMat = new THREE.MeshStandardMaterial({color:0x0c0a10});
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.55,6,10), barkMat);
  trunk.position.set(0,3,0);
  willowGroup.add(trunk);
  const canopyMat = new THREE.MeshStandardMaterial({color:0x0a0910});
  const canopy = new THREE.Mesh(new THREE.SphereGeometry(3.2,14,10), canopyMat);
  canopy.position.set(0,7.2,0);
  canopy.scale.set(1.3,0.85,1.3);
  willowGroup.add(canopy);
  const branchCount = 14;
  for(let i=0;i<branchCount;i++){
    const ang = (i/branchCount)*Math.PI*2;
    const r = 2.6+Math.random()*0.6;
    const branch = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.09,4.5+Math.random()*2,5), barkMat);
    branch.position.set(Math.cos(ang)*r, 5.4, Math.sin(ang)*r);
    branch.rotation.x = Math.PI*0.42 + (Math.random()*0.15-0.075);
    branch.rotation.y = -ang;
    willowGroup.add(branch);
  }
  willowGroup.position.set(1.5, 0, -68);
  memScene.add(willowGroup);

  function loop(){
    if(state.keys['arrowleft']) memYaw += 0.03;
    if(state.keys['arrowright']) memYaw -= 0.03;
    const dir = new THREE.Vector3(Math.sin(memYaw),0,-Math.cos(memYaw));
    if(state.keys['w']){
      memCamera.position.addScaledVector(dir, 0.09);
      memCamera.position.x = Math.max(-11, Math.min(11, memCamera.position.x));
    }
    if(state.keys['s']){
      memCamera.position.addScaledVector(dir, -0.06);
    }
    memCamera.position.y = 1.6 + Math.sin(performance.now()*0.003)*0.03;
    memCamera.rotation.y = memYaw;

    memRenderer.render(memScene, memCamera);

    if(!memDone && memCamera.position.z < -60){
      memDone = true;
      finishMemory();
    }
    if(state.mode==='MEMORY') memRAF = requestAnimationFrame(loop);
  }
  memRAF = requestAnimationFrame(loop);
}

function finishMemory(){
  cancelAnimationFrame(memRAF);
  state.memoryDone = true;
  writeSave();
  const isEnding = state.bossDefeated;
  setTimeout(()=>{
    canvas3d.style.display='none';
    if(isEnding){
      showWin();
    } else {
      goToHub();
      openDialogue('A MEMORY', ["A hallway you don't recognize, and yet every door is one you've closed.", "The light at the end isn't an exit. It's a stamp, waiting to fall."], null, ()=>{});
    }
  }, 400);
}

  if(state.mode==='DUNGEON' && dungeon && dungeon.enemies){

      el.turnOrderRow.textContent = '';

        if(e.fast) return e.name+' (×2)';
        return e.name;
      });
      el.turnOrderRow.textContent = 'NEXT TO ACT: '+parts.join(', ')+(nearby.length>4?' …':'');
    }
  } else {
    el.turnOrderRow.textContent = '';
  }
}

    b.onclick = ()=>{ chosenDifficulty=value; diffBtns.forEach(x=>x.className='btn'); b.className='btn primary'; };
    diffBtns.push(b);
    return b;
  };
  const diffStd = makeDiffBtn('STANDARD','standard'); diffStd.className='btn primary';
  const diffHard = makeDiffBtn('HARDCORE','hardcore');
  diffWrap.appendChild(diffStd); diffWrap.appendChild(diffHard);
  if(stats.nightmareUnlocked){
    diffWrap.appendChild(makeDiffBtn('NIGHTMARE','nightmare'));
  }
  el.overlay.appendChild(diffWrap);
  const diffNote = document.createElement('p'); diffNote.className='flavor';
  diffNote.style.cssText='font-size:10px;margin:-4px 0 14px 0;color:#7a7f8c;';
  diffNote.textContent = 'Hardcore: enemies hit 1.5x harder, no Second Wind.'+(stats.nightmareUnlocked?' Nightmare: 2x harder, unlocked by finishing the true ending.':'');
  el.overlay.appendChild(diffNote);


  // Optional seed field ... deterministic dungeon layouts, for the developer in your life
  const seedWrap = document.createElement('div');
  seedWrap.style.cssText='margin-bottom:16px;';
  const seedInput = document.createElement('input');
  seedInput.type='text'; seedInput.placeholder='dungeon seed (optional)';
  seedInput.style.cssText='font-family:"IBM Plex Mono",monospace;background:#141824;border:1px solid #8a713c;color:#e8e1d0;padding:7px 10px;font-size:11px;width:220px;text-align:center;';
  seedWrap.appendChild(seedInput);
  el.overlay.appendChild(seedWrap);

  const btnNew = document.createElement('div'); btnNew.className='btn primary'; btnNew.textContent='NEW CASE FILE';
  btnNew.onclick = ()=>startNewGame(chosenDifficulty, seedInput.value);
  el.overlay.appendChild(btnNew);

  if(save){
    const btnCont = document.createElement('div'); btnCont.className='btn'; btnCont.textContent='CONTINUE CASE FILE';
    btnCont.onclick = ()=>continueGame(save);
    el.overlay.appendChild(btnCont);
  }
  const btnStats = document.createElement('div'); btnStats.className='btn'; btnStats.style.fontSize='11px'; btnStats.textContent='RUN STATISTICS';
  btnStats.onclick = ()=>showStats();
  el.overlay.appendChild(btnStats);

  const note = document.createElement('p'); note.className='flavor';
  note.style.fontSize='10.5px'; note.style.marginTop='16px'; note.style.color='#5f6472';
  note.textContent = 'Controls: WASD/Arrows/D-pad move · SPACE/ACT dash, interact, advance';
  el.overlay.appendChild(note);
}

function showStats(){
  el.overlay.innerHTML='';
  const h1=document.createElement('h1'); h1.style.fontSize='26px'; h1.textContent='CASE STATISTICS';
  const sub=document.createElement('div'); sub.className='sub'; sub.textContent='ACROSS ALL CASE FILES';
  el.overlay.appendChild(h1); el.overlay.appendChild(sub);
  const rows = [
    ['Enemies dismissed', stats.kills],
    ['Times filed (deaths)', stats.deaths],
    ['Deepest floor reached', stats.deepestFloor],
    ['Case files opened', stats.runsStarted],
    ['Best case-closed time', stats.bestTimeMs!=null ? formatTime(stats.bestTimeMs) : '...'],
    ['Achievements found', Object.keys(stats.achievementsSeen).length+' / '+ACHIEVEMENT_IDS.length],
  ];
  const table = document.createElement('div');
  table.style.cssText='text-align:left;width:280px;font-size:12px;color:#c9c3b0;margin-bottom:20px;';
  rows.forEach(([label,val])=>{
    const row=document.createElement('div');
    row.style.cssText='display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(201,161,90,0.15);';
    row.innerHTML = '<span>'+label+'</span><span style="color:#c9a15a;">'+val+'</span>';
    table.appendChild(row);
  });
  el.overlay.appendChild(table);
  const btn=document.createElement('div'); btn.className='btn primary'; btn.textContent='BACK';
  btn.onclick=()=>showMenu();
  el.overlay.appendChild(btn);
}

function resetProgress(){
  state.shards = emptyShards();
  state.vaultSolved=false; state.archiveSolved=false;
  state.bossDefeated=false; state.minibossDefeated=false; state.finalBossDefeated=false;
  state.memoryDone=false; state.usedSecondWind=false; state.maxHpBonus=0;
  state.andyUnlocked=false;
  state.equippedTrinket=null;
  state.inventory=[];
  state.subbasementUnlocked=false;
  state.subbasementClaimed=false;
  state.duelWon=false;
  state.rivalDuelWon=false;
  state.player.level=1; state.player.xp=0;
  state.player.limit=0;
  state.skillPoints=0;
  state.skills={ vigor:0, precision:0, procedure:0, tenacity:0 };
  state.player.hp = maxHp();
}
function startNewGame(difficulty, seed){
  resetProgress();
  state.difficulty = difficulty || 'standard';
  setSeed(seed || '');
  state.caseNo = (loadSave()?.caseNo || 0) + 1;
  state.runStartTime = Date.now();
  stats.runsStarted++;
  writeStats();
  el.fileTag.textContent = 'CASE FILE NO. '+String(state.caseNo).padStart(4,'0');
  el.overlay.style.display='none';
  writeSave();
  goToHub();
  updateHud();
  ensureAudio();
  openDialogue('CASE FILE OPENED', ["Another one for the ledger. Try to make this stay shorter than the last."+(state.difficulty==='hardcore'?" Hardcore, this time ... bold of you.":"")], null, ()=>{});
}
function continueGame(save){
  state.shards = { ...emptyShards(), ...Object.fromEntries((save.shards||[]).map(k=>[k,true])) };
  state.vaultSolved = !!save.vaultSolved;
  state.archiveSolved = !!save.archiveSolved;
  state.bossDefeated = !!save.bossDefeated;
  state.minibossDefeated = !!save.minibossDefeated;
  state.finalBossDefeated = !!save.finalBossDefeated;
  state.memoryDone = !!save.memoryDone;
  state.andyUnlocked = !!save.andyUnlocked;
  state.difficulty = save.difficulty || 'standard';
  state.equippedTrinket = save.equippedTrinket || null;
  state.ngPlusCount = save.ngPlusCount || 0;
  state.maxHpBonus = save.maxHpBonus||0;
  state.player.level = save.level||1;
  state.player.xp = save.xp||0;
  state.player.limit = save.limit||0;
  state.caseNo = save.caseNo || 1;
  state.runStartTime = save.runStartTime || Date.now();
  state.inventory = Array.isArray(save.inventory) ? save.inventory.slice() : [];
  state.subbasementUnlocked = !!save.subbasementUnlocked;
  state.subbasementClaimed = !!save.subbasementClaimed;
  state.duelWon = !!save.duelWon;
  state.rivalDuelWon = !!save.rivalDuelWon;
  state.skillPoints = save.skillPoints || 0;
  state.skills = Object.assign({ vigor:0, precision:0, procedure:0, tenacity:0 }, save.skills||{});
  setSeed(save.seed || '');
  el.fileTag.textContent = 'CASE FILE NO. '+String(state.caseNo).padStart(4,'0');
  state.player.hp = maxHp();
  el.overlay.style.display='none';
  goToHub();
  updateHud();
}

function showOverlayGameOver(){
  canvas2d.style.display='block';
  el.hudTop.style.display='none';
  el.overlay.innerHTML='';
  el.overlay.style.display='flex';
  const h1=document.createElement('h1'); h1.style.color='#b4453a'; h1.textContent='FILE CLOSED';
  const sub=document.createElement('div'); sub.className='sub'; sub.style.color='#b4453a'; sub.textContent='CAUSE OF DEATH: CLERICAL';
  const p=document.createElement('p'); p.className='flavor';
  p.textContent = "You slip out of the body a second time. Inconvenient, but not unprecedented. Anything you'd already filed ... the shards ... stays filed.";
  el.overlay.appendChild(h1); el.overlay.appendChild(sub); el.overlay.appendChild(p);
  const btn=document.createElement('div'); btn.className='btn primary'; btn.textContent='RETURN TO RECORDS';
  btn.onclick = ()=>{
    el.overlay.style.display='none';
    state.player.hp = maxHp();
    state.floor = 1;
    goToHub();
    updateHud();
  };
  el.overlay.appendChild(btn);
}

function showWin(){
  state.mode='WIN';
  writeSave();
  playSfx('win');
  achieve('win','Case Closed');
  const trueEnding = state.finalBossDefeated;
  if(trueEnding && !stats.nightmareUnlocked){
    stats.nightmareUnlocked = true;
    writeStats();
  }
  const runMs = elapsedRunTime();
  let newBest = false;
  if(runMs>0 && (stats.bestTimeMs==null || runMs < stats.bestTimeMs)){
    stats.bestTimeMs = runMs;
    newBest = true;
    writeStats();
  }
  canvas3d.style.display='none';
  canvas2d.style.display='none';
  el.hudTop.style.display='none';
  el.overlay.innerHTML='';
  el.overlay.style.display='flex';
  const h1=document.createElement('h1'); h1.textContent = trueEnding ? 'CASE PERMANENTLY CLOSED' : 'CASE CLOSED';
  const sub=document.createElement('div'); sub.className='sub'; sub.textContent = trueEnding ? 'FORM 14-B, SEALED ENTRY' : 'FORM 14-B, FINAL ENTRY';
  const p=document.createElement('p'); p.className='flavor';
  p.textContent = trueEnding
    ? "The Auditor is silenced, the Repossessor answered for, and the Chief Auditor's own signature finally revoked. The photograph is yours again, all the way down. Somewhere above, an entire cabinet slides shut ... and locks. Whatever you were still owed, the ledger finally agrees the debt runs the other way now."
    : "The Auditor is silenced, the photograph returned to whoever you were. The Department, for once, has nothing left to ask of you. Somewhere above, a drawer slides shut. (Deeper floors remain, if you're not done yet.)";
  el.overlay.appendChild(h1); el.overlay.appendChild(sub); el.overlay.appendChild(p);
  const shardCount = Object.values(state.shards).filter(Boolean).length;
  const summary = document.createElement('p'); summary.className='flavor';
  summary.style.cssText='font-size:11px;color:#7a7f8c;margin-top:-8px;';
  const diffTag = state.difficulty==='nightmare' ? ' · NIGHTMARE' : state.difficulty==='hardcore' ? ' · HARDCORE' : '';
  summary.textContent = 'Level '+state.player.level+' · '+shardCount+'/6 shards · '+stats.kills+' dismissed · '+formatTime(runMs)+(newBest?' (NEW BEST)':'')+' · '+(currentSeed?('seed "'+currentSeed+'"'):'unseeded run')+diffTag;
  el.overlay.appendChild(summary);
  if(trueEnding){
    const btnNgPlus=document.createElement('div'); btnNgPlus.className='btn primary'; btnNgPlus.textContent='NEW GAME+';
    btnNgPlus.title='Carry your level forward into a fresh, harder case file.';
    btnNgPlus.onclick = ()=>startNewGamePlus();
    el.overlay.appendChild(btnNgPlus);
  }
  const btn=document.createElement('div'); btn.className='btn'+(trueEnding?'':' primary'); btn.textContent='OPEN A NEW CASE FILE';
  btn.onclick = ()=>showMenu();
  el.overlay.appendChild(btn);
}

function startNewGamePlus(){
  const carriedLevel = Math.max(1, Math.ceil(state.player.level/2));
  const nextDifficulty = stats.nightmareUnlocked ? 'nightmare' : state.difficulty;
  resetProgress();
  state.player.level = carriedLevel;
  state.player.xp = 0;
  state.player.hp = maxHp();
  state.difficulty = nextDifficulty;
  state.ngPlusCount++;
  state.caseNo = (loadSave()?.caseNo || 0) + 1;
  state.runStartTime = Date.now();
  stats.runsStarted++; writeStats();
  el.fileTag.textContent = 'CASE FILE NO. '+String(state.caseNo).padStart(4,'0')+' (NG+'+state.ngPlusCount+')';
  el.overlay.style.display='none';
  writeSave();
  goToHub();
  updateHud();
  openDialogue('NEW GAME+', ["The ledger resets, but you don't ... not entirely. Level "+carriedLevel+", and everyone's a little more suspicious of you this time."], null, ()=>{});
}

// ---------------------------------------------------------------------
// 11. MAIN LOOP
// ---------------------------------------------------------------------
// ---------------------------------------------------------------------
// 0g. GAMEPAD SUPPORT ... standard mapping: left stick / d-pad to move,
// button 0 (A / Cross) as ACT. Polled once per frame from mainLoop.
// ---------------------------------------------------------------------
let _gpButtonAWasPressed = false;
let _gamepadBlocked = false;
function pollGamepad(){
  if(_gamepadBlocked || !navigator.getGamepads) return;
  let pads;
  try{
    pads = navigator.getGamepads();
  }catch(e){
    // Some embedding contexts (sandboxed iframes, restrictive permissions
    // policies) throw a SecurityError just for calling this. Disable
    // future polling rather than throwing every frame.
    _gamepadBlocked = true;
    return;
  }
  const gp = pads && pads[0];
  if(!gp) return;
  ensureAudio();

  const dead = 0.5;
  const up = (gp.axes[1]||0) < -dead || !!(gp.buttons[12]&&gp.buttons[12].pressed);
  const down = (gp.axes[1]||0) > dead || !!(gp.buttons[13]&&gp.buttons[13].pressed);
  const left = (gp.axes[0]||0) < -dead || !!(gp.buttons[14]&&gp.buttons[14].pressed);
  const right = (gp.axes[0]||0) > dead || !!(gp.buttons[15]&&gp.buttons[15].pressed);
  // Mirror onto the shared key-state so modes that read state.keys directly
  // (the Vault physics puzzle, the memory sequence) respond to a gamepad
  // too, not just the grid-based modes handled below.
  state.keys['w'] = state.keys['arrowup'] = up;
  state.keys['s'] = state.keys['arrowdown'] = down;
  state.keys['a'] = state.keys['arrowleft'] = left;
  state.keys['d'] = state.keys['arrowright'] = right;

  const aPressed = !!(gp.buttons[0] && gp.buttons[0].pressed);
  if(['HUB','DUNGEON','ARCHIVE'].includes(state.mode)){
    let dx=0, dy=0;
    if(up) dy=-1; else if(down) dy=1;
    if(left) dx=-1; else if(right) dx=1;
    if(dx||dy) tryMove(dx,dy);
  }
  if(aPressed && !_gpButtonAWasPressed){
    if(state.mode==='DIALOGUE') advanceDialogue();
    else if(state.mode==='DUNGEON' && state.shards.hollow && state.player.dashCd<=0) dashMove();
    else if(state.mode==='ARCHIVE') archiveToggle();
    else if(state.mode==='PANEL') closePanel();
    else if(state.mode==='PUZZLE') leaveNonSolvedArea();
  }
  _gpButtonAWasPressed = aPressed;
}

// ---------------------------------------------------------------------
// 9. THE VOID ... a short, skippable overture that plays before the menu.
// No office yet, no forms, just the dark the player arrived from. Drawn
// directly on canvas2d (a faint drifting starfield + slow fading lines)
// so it needs no new assets and can't collide with mainLoop, which stays
// idle in MENU mode until this hands off to showMenu().
// ---------------------------------------------------------------------
function playVoidIntro(onDone){
  canvas2d.style.display='block';
  canvas3d.style.display='none';
  el.hudTop.style.display='none';
  el.overlay.style.display='none';
  el.dialogue.style.display='none';
  el.controlsNote.textContent='';

  const stars = [];
  for(let i=0;i<150;i++){
    stars.push({
      x: Math.random()*canvas2d.width, y: Math.random()*canvas2d.height,
      r: Math.random()*1.3+0.3, phase: Math.random()*Math.PI*2, speed: 0.4+Math.random()*0.9,
    });
  }
  const LINES = [
    "First, the infinite black. Not a room, not a road ... no edges to it at all.",
    "You don't remember arriving. You remember stopping. The two feel the same, down there.",
    "Something down in that dark found what was broken in you and healed it. Not gently. Thoroughly, the way a form gets stamped.",
    "No one can tell you how long you were down there, only that you didn't stay broken.",
    "What healed wasn't the body. The body was never the part that needed filing.",
    "Eventually, someone found your file, and decided you were owed a desk.",
  ];
  let lineIdx = 0;
  let done = false;
  let lineStart = performance.now();
  // Reading time scales with how much text is on screen, with a generous
  // floor, so nobody has to rush a line or tap through it manually.
  function readDurationFor(line){
    return Math.max(5200, line.length * 95);
  }

  function finish(){
    if(done) return;
    done = true;
    window.removeEventListener('keydown', onSkipKey);
    canvas2d.removeEventListener('click', onSkipClick);
    canvas2d.removeEventListener('touchstart', onSkipClick);
    ctx.textAlign = 'left';
    onDone();
  }
  // Skipping ahead (click/tap/key) is still available for anyone who wants
  // to move faster, but nothing here requires it ... the intro reads
  // itself through on its own on a per-line timer.
  function skipLine(){
    if(done) return;
    lineIdx++;
    lineStart = performance.now();
    if(lineIdx >= LINES.length) finish();
  }
  function onSkipKey(e){
    if(e.key==='Escape'){ finish(); return; }
    skipLine();
  }
  function onSkipClick(){ skipLine(); }
  window.addEventListener('keydown', onSkipKey);
  canvas2d.addEventListener('click', onSkipClick);
  canvas2d.addEventListener('touchstart', onSkipClick);

  function frame(now){
    if(done) return;
    const t = now - start;
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,canvas2d.width,canvas2d.height);
    for(const s of stars){
      const tw = 0.3 + 0.3*Math.sin(t*0.0006*s.speed + s.phase);
      ctx.fillStyle = 'rgba(228,224,245,'+(tw*0.55)+')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    }
    const g = ctx.createRadialGradient(canvas2d.width/2,canvas2d.height/2,60, canvas2d.width/2,canvas2d.height/2,canvas2d.width*0.7);
    g.addColorStop(0, 'rgba(20,16,30,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.6)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,canvas2d.width,canvas2d.height);

    const line = LINES[lineIdx] || '';
    // Text is large, fully opaque, and stationary for the whole dwell
    // time ... no fade in, no fade out, nothing shrinking or sliding.
    const alpha = 1;

    // Word-wrap so long lines never run off the edges of the canvas.
    // Font is large and scales up a little on the wider desktop canvas.
    const maxTextWidth = canvas2d.width - 90;
    const fontPx = Math.round(canvas2d.width * 0.034) + 14; // ~40px at 800 wide
    ctx.font = 'bold '+fontPx+'px "IBM Plex Mono"';
    const words = line.split(' ');
    const wrapped = [];
    let cur = '';
    for(const w of words){
      const test = cur ? cur+' '+w : w;
      if(ctx.measureText(test).width > maxTextWidth && cur){
        wrapped.push(cur); cur = w;
      } else cur = test;
    }
    if(cur) wrapped.push(cur);

    const lineHeight = fontPx*1.5;
    const blockHeight = wrapped.length*lineHeight;
    const cy = canvas2d.height/2;
    const blockTop = cy - blockHeight/2 - 10;

    // Solid backing panel so the text reads as grounded, not floating.
    let panelW = 0;
    wrapped.forEach(l=>{ panelW = Math.max(panelW, ctx.measureText(l).width); });
    panelW = Math.min(canvas2d.width-40, panelW + 72);
    const panelH = blockHeight + 50;
    ctx.fillStyle = 'rgba(6,5,9,'+(alpha*0.8)+')';
    ctx.fillRect(canvas2d.width/2 - panelW/2, blockTop - 26, panelW, panelH);
    ctx.strokeStyle = 'rgba(201,161,90,'+(alpha*0.4)+')';
    ctx.lineWidth = 1;
    ctx.strokeRect(canvas2d.width/2 - panelW/2 + 0.5, blockTop - 26 + 0.5, panelW-1, panelH-1);

    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(238,232,216,0.98)';
    wrapped.forEach((l,i)=>{
      ctx.fillText(l, canvas2d.width/2, blockTop + i*lineHeight);
    });

    // Progress dots, so it's clear more is coming without needing to read a timer
    const dotY = blockTop + blockHeight + 30;
    const dotSpacing = 16, dotsW = (LINES.length-1)*dotSpacing;
    for(let i=0;i<LINES.length;i++){
      ctx.beginPath();
      ctx.arc(canvas2d.width/2 - dotsW/2 + i*dotSpacing, dotY, i===lineIdx?3.2:2, 0, Math.PI*2);
      ctx.fillStyle = i===lineIdx ? 'rgba(201,161,90,0.9)' : 'rgba(201,161,90,0.3)';
      ctx.fill();
    }

    ctx.textAlign = 'right';
    ctx.font = '11px "IBM Plex Mono"';
    ctx.fillStyle = 'rgba(180,180,195,0.5)';
    ctx.fillText('reads on its own \u2013 tap to skip ahead', canvas2d.width-16, canvas2d.height-16);

    if(now - lineStart >= readDurationFor(line)) skipLine();
    requestAnimationFrame(frame);
  }
  const start = performance.now();
  requestAnimationFrame(frame);
}

function mainLoop(){
  pollGamepad();
  if(state.mode==='HUB') drawHub();
  else if(state.mode==='DUNGEON') drawDungeon();
  else if(state.mode==='ARCHIVE') drawArchive();
  else if(state.mode==='DIALOGUE' || state.mode==='PANEL'){
    if(state.prevMode==='HUB') drawHub();
    else if(state.prevMode==='DUNGEON') drawDungeon();
    else if(state.prevMode==='ARCHIVE') drawArchive();
  }
  if(['HUB','DUNGEON','DIALOGUE','PANEL'].includes(state.mode)) updateHud();
  requestAnimationFrame(mainLoop);
}
requestAnimationFrame(mainLoop);
loadStats();
playVoidIntro(showMenu);
</script>
